name: Full Upgrade & Deployment Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sawaj-full-upgrade
  cancel-in-progress: true

jobs:
  full_upgrade:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}
          ref: main
          fetch-depth: 1

      - name: 2. Setup Python & System Tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install FFmpeg, Fonts & Python Packages
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto fonts-noto-color-emoji fontconfig
          sudo fc-cache -f -v
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install requests edge-tts google-api-python-client google-auth-httplib2 google-auth-oauthlib Pillow mutagen numpy PyYAML
          fi

      - name: 4. Write Upgraded Subtitles & Renderer Files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'EOF'
          import base64
          from pathlib import Path

          ass_src = '''import os
          import re

          # Bright glowing ASS colors (&HAABBGGRR&)
          PALETTE = [
              "&H001E90FF&",  # Bright Orange / Amber
              "&H00FFFF33&",  # Bright Cyan / Aqua
              "&H0033FF99&",  # Bright Mint / Neon Green
              "&H00FF66FF&",  # Bright Magenta / Pink
              "&H0033CCFF&",  # Bright Gold / Yellow-Orange
              "&H00FFAA44&",  # Bright Sky Blue
          ]

          def _fmt_ts(sec):
              sec = max(0.0, float(sec))
              h = int(sec // 3600)
              m = int((sec % 3600) // 60)
              s = int(sec % 60)
              cs = min(99, int(round((sec - int(sec)) * 100)))
              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

          def _split_2_to_3_words(text):
              words = [w.strip() for w in str(text or "").split() if w.strip()]
              if not words:
                  return []
              chunks = []
              i = 0
              n = len(words)
              while i < n:
                  rem = n - i
                  if rem <= 3:
                      step = rem
                  elif rem == 4:
                      step = 2
                  else:
                      step = 3
                  chunks.append(" ".join(words[i:i + step]))
                  i += step
              return chunks

          def create_main_subtitles(hadith, hindi_text, duration, output_path="temp/main_subtitles.ass"):
              hadith_dict = hadith if isinstance(hadith, dict) else {}
              ara_src = re.sub(r'[\\"\\n\\r]', " ", str(hadith_dict.get("arabic", ""))).strip()
              hin_src = re.sub(r'[\\"\\n\\r]', " ", str(hindi_text or "")).strip()
              eng_src = re.sub(r'[\\"\\n\\r]', " ", str(hadith_dict.get("english", ""))).strip()

              ara_parts = _split_2_to_3_words(ara_src)
              hin_parts = _split_2_to_3_words(hin_src)
              eng_parts = _split_2_to_3_words(eng_src)
              steps = max(len(ara_parts), len(hin_parts), len(eng_parts), 1)

              # Alignment=2 (bottom-center) with clean stacked MarginV from bottom (1920):
              # Block 1 (Arabic): MarginV 980 (bar at 930)
              # Block 2 (Hindi):  MarginV 730 (bar at 680)
              # Block 3 (English):MarginV 480 (bar at 430)
              header = [
                  "[Script Info]",
                  "ScriptType: v4.00+",
                  "PlayResX: 1080",
                  "PlayResY: 1920",
                  "WrapStyle: 2",
                  "",
                  "[V4+ Styles]",
                  "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
                  "Style: DotAra,Arial,68,&H00FFFFFF&,&H000000FF&,&H00000000&,&H99000000,-1,0,0,0,100,100,0,0,1,4,3,2,80,80,982,1",
                  "Style: AraText,Amiri,74,&H00FFFFFF&,&H000000FF&,&H00000000&,&H99000000,-1,0,0,0,100,100,0,0,1,4,3,2,150,80,980,1",
                  "Style: BarAra,Arial,34,&H00FFFFFF&,&H000000FF&,&H00000000&,&H66000000,-1,0,0,0,125,65,-2,0,1,2,2,2,150,80,928,1",
                  "Style: DotHin,Arial,68,&H00FFFFFF&,&H000000FF&,&H00000000&,&H99000000,-1,0,0,0,100,100,0,0,1,4,3,2,80,80,732,1",
                  "Style: HinText,Yatra One,66,&H00FFFFFF&,&H000000FF&,&H00000000&,&H99000000,-1,0,0,0,100,100,0,0,1,4,3,2,150,80,730,1",
                  "Style: BarHin,Arial,34,&H00FFFFFF&,&H000000FF&,&H00000000&,&H66000000,-1,0,0,0,125,65,-2,0,1,2,2,2,150,80,678,1",
                  "Style: DotEng,Arial,68,&H00FFFFFF&,&H000000FF&,&H00000000&,&H99000000,-1,0,0,0,100,100,0,0,1,4,3,2,80,80,482,1",
                  "Style: EngText,Playfair Display,62,&H00FFFFFF&,&H000000FF&,&H00000000&,&H99000000,-1,0,0,0,100,100,0,0,1,4,3,2,150,80,480,1",
                  "Style: BarEng,Arial,34,&H00FFFFFF&,&H000000FF&,&H00000000&,&H66000000,-1,0,0,0,125,65,-2,0,1,2,2,2,150,80,428,1",
                  "",
                  "[Events]",
                  "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
              ]

              t_start = 4.0
              t_end = max(float(duration or 20.0) - 4.2, t_start + 3.0)
              step_dur = (t_end - t_start) / steps
              bar_str = "▬▬▬▬▬▬▬▬▬▬▬▬▬▬"

              lines = []
              for i in range(steps):
                  s = t_start + i * step_dur
                  e = s + step_dur
                  a_val = ara_parts[i % len(ara_parts)] if ara_parts else ""
                  h_val = hin_parts[i % len(hin_parts)] if hin_parts else ""
                  e_val = eng_parts[i % len(eng_parts)] if eng_parts else ""

                  c_a = PALETTE[i % len(PALETTE)]
                  c_h = PALETTE[(i + 1) % len(PALETTE)]
                  c_e = PALETTE[(i + 2) % len(PALETTE)]

                  if a_val:
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},DotAra,,,0,0,,{{\\1c{c_a}\\3c&H000000&\\blur2}}●")
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},AraText,,,0,0,,{{\\1c{c_a}\\3c&H000000&\\blur1}}{a_val}")
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},BarAra,,,0,0,,{{\\1c{c_a}\\3c&H000000&\\blur2}}{bar_str}")
                  if h_val:
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},DotHin,,,0,0,,{{\\1c{c_h}\\3c&H000000&\\blur2}}●")
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},HinText,,,0,0,,{{\\1c{c_h}\\3c&H000000&\\blur1}}{h_val}")
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},BarHin,,,0,0,,{{\\1c{c_h}\\3c&H000000&\\blur2}}{bar_str}")
                  if e_val:
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},DotEng,,,0,0,,{{\\1c{c_e}\\3c&H000000&\\blur2}}●")
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},EngText,,,0,0,,{{\\1c{c_e}\\3c&H000000&\\blur1}}{e_val}")
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},BarEng,,,0,0,,{{\\1c{c_e}\\3c&H000000&\\blur2}}{bar_str}")

              out_dir = os.path.dirname(output_path) or "temp"
              os.makedirs(out_dir, exist_ok=True)
              with open(output_path, "w", encoding="utf-8") as f:
                  f.write("\\n".join(header + lines) + "\\n")
              return output_path

          def create_intro_subtitle(intro_text, duration=3.5, output_path="temp/intro_sub.ass"):
              return None

          def create_outro_subtitle(outro_text, total_duration, outro_duration=3.5, output_path="temp/outro_sub.ass"):
              return None
          '''

          render_src = '''import os
          import subprocess
          import sys

          def _esc_ffmpeg_path(p):
              return (
                  p.replace("\\\\", "\\\\\\\\")
                  .replace(":", "\\\\:")
                  .replace("'", "\\\\'")
                  .replace("[", "\\\\[")
                  .replace("]", "\\\\]")
              )

          def render_final_video(
              bg_video,
              music_path,
              voice_path,
              master_ass_path,
              cta_image_path,
              duration,
              output_path="temp/Final_Story.mp4",
              fonts_dir=None,
              logo_path=None,
          ):
              sys.stdout.flush()
              if not bg_video or not os.path.exists(bg_video) or not voice_path or not os.path.exists(voice_path):
                  print("❌ [ffmpeg_render] Missing bg_video or voice_path.")
                  return None
              if not master_ass_path or not os.path.exists(master_ass_path):
                  print("❌ [ffmpeg_render] Missing master_ass_path.")
                  return None

              if fonts_dir is None or not os.path.exists(fonts_dir):
                  fonts_dir = os.path.normpath(
                      os.path.join(os.path.dirname(os.path.abspath(__file__)), "..", "..", "Assets")
                  )
              abs_fonts = os.path.abspath(fonts_dir) if fonts_dir and os.path.exists(fonts_dir) else ""

              out_dir = os.path.dirname(output_path) or "temp"
              os.makedirs(out_dir, exist_ok=True)

              cmd = ["ffmpeg", "-y", "-stream_loop", "-1", "-i", bg_video, "-i", voice_path]
              has_music = bool(music_path and os.path.exists(music_path) and os.path.getsize(music_path) > 0)
              if has_music:
                  cmd += ["-i", music_path]

              has_cta = bool(cta_image_path and os.path.exists(cta_image_path))
              if has_cta:
                  cmd += ["-loop", "1", "-i", cta_image_path]

              cta_idx = 3 if has_music else 2
              v = "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,eq=brightness=0.02:contrast=1.12:saturation=1.15[bg];"

              abs_ass_esc = _esc_ffmpeg_path(os.path.abspath(master_ass_path))
              abs_fonts_esc = _esc_ffmpeg_path(abs_fonts) if abs_fonts else ""

              if abs_fonts_esc:
                  v += f"[bg]subtitles=filename=\\'{abs_ass_esc}\\':fontsdir=\\'{abs_fonts_esc}\\'[v_sub];"
              else:
                  v += f"[bg]subtitles=filename=\\'{abs_ass_esc}\\'[v_sub];"

              if has_cta:
                  cta_start = max(0.0, float(duration) - 4.2)
                  v += f"[v_sub][{cta_idx}:v]overlay=0:0:enable=\\'gte(t,{cta_start:.2f})\\'[v_out]"
              else:
                  v += "[v_sub]null[v_out]"

              if has_music:
                  a = (
                      "[2:a]volume=0.15[bgm];"
                      "[bgm][1:a]sidechaincompress=threshold=0.05:ratio=8:attack=50:release=500[ducked];"
                      "[1:a][ducked]amix=inputs=2:duration=first[a_out]"
                  )
              else:
                  a = "[1:a]volume=1.0[a_out]"

              cmd += [
                  "-filter_complex",
                  f"{v}; {a}",
                  "-map",
                  "[v_out]",
                  "-map",
                  "[a_out]",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "ultrafast",
                  "-crf",
                  "24",
                  "-threads",
                  "0",
                  "-r",
                  "24",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "128k",
                  "-t",
                  f"{float(duration):.2f}",
                  output_path,
              ]
              try:
                  res = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
                  if res.returncode != 0:
                      print("❌ === FFMPEG ERROR START ===")
                      print(res.stderr[-2000:])
                      print("❌ === FFMPEG ERROR END ===")
                      return None
                  return output_path
              except Exception as exc:
                  print(f"❌ [ffmpeg_render] Exception: {exc}")
                  return None
          '''

          targets = [
              (Path("Story/Subtitles_Text/ass_builder.py"), ass_src),
              (Path("Story/Final_Render/ffmpeg_render.py"), render_src),
          ]

          for path, content in targets:
              path.parent.mkdir(parents=True, exist_ok=True)
              b64_payload = base64.b64encode(content.encode("utf-8")).decode("ascii")
              path.write_bytes(base64.b64decode(b64_payload))
              print(f"✅ Wrote {path}")
          EOF

      - name: 5. Validate Syntax & 2-3 Word Subtitles
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            Story/Subtitles_Text/ass_builder.py \
            Story/Final_Render/ffmpeg_render.py \
            Story/Final_Render/render_video.py \
            Story/Pipeline_Orchestration/composer.py
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "Story/Subtitles_Text")
          from ass_builder import create_main_subtitles, _split_2_to_3_words

          sample_chunks = _split_2_to_3_words("Abdullah reported Allah's Messenger as saying")
          assert all(1 <= len(c.split()) <= 3 for c in sample_chunks)

          out = create_main_subtitles(
              {"arabic": "عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ قَالَ", "english": "Abdullah reported Allah's Messenger as saying"},
              "अब्दुल्लाह बिन मसूद से रिवायत है",
              20.0,
              "temp/verify_subs.ass",
          )
          assert out and len(open(out, encoding="utf-8").read()) > 150
          print("✅ Bright 2-3 word subtitle check passed:", out)
          EOF
          rm -rf temp

      - name: 6. Commit & Push Upgrade to Development
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "sawaj-bot"
          git config user.email "bot@sawajstudio.local"
          if [ -n "${GH_TOKEN:-}" ]; then
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/Development.git"
          fi
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: bright glowing 3-language 2-3 word subtitles with dot and bar"
            git push origin HEAD:main
            echo "✅ Successfully pushed upgrade to Development/main"
          else
            echo "ℹ️ No changes to commit."
          fi
