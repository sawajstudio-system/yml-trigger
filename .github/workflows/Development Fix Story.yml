name: 🛠️ Fix All Paths, Add fawaz.py & Run Story Pipeline

on:
  workflow_dispatch:

concurrency:
  group: story-pipeline
  cancel-in-progress: false

jobs:
  fix_and_run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - name: 1. 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 📦 Install FFmpeg, Fonts & Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto fonts-noto-color-emoji fontconfig
          sudo fc-cache -f -v
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install requests edge-tts google-api-python-client google-auth-httplib2 google-auth-oauthlib Pillow mutagen numpy PyYAML
          fi

      - name: 4. 🔧 Create Sources/fawaz.py & Fix All Code Paths (Zero Delete)
        run: |
          python3 - <<'PYEOF'
          import py_compile
          from pathlib import Path

          ROOT = Path(".").resolve()
          sources_dir = ROOT / "Sources"
          sources_dir.mkdir(parents=True, exist_ok=True)

          # 1. Create missing Sources/fawaz.py
          fawaz_file = sources_dir / "fawaz.py"
          if not fawaz_file.exists():
              fawaz_src = (
                  "import random\n"
                  "import requests\n\n"
                  "BOOKS = [\n"
                  '    ("bukhari", "Sahih al-Bukhari"),\n'
                  '    ("muslim", "Sahih Muslim"),\n'
                  '    ("abudawud", "Sunan Abi Dawud"),\n'
                  '    ("tirmidhi", "Jami at-Tirmidhi"),\n'
                  '    ("nasai", "Sunan an-Nasa\'i"),\n'
                  '    ("ibnmajah", "Sunan Ibn Majah"),\n'
                  "]\n\n"
                  "FALLBACK_HADITHS = [\n"
                  "    {\n"
                  '        "collection": "Sahih al-Bukhari",\n'
                  '        "number": "1",\n'
                  '        "arabic": "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ",\n'
                  '        "english": "The reward of deeds depends upon the intentions and every person will get the reward according to what he has intended.",\n'
                  '        "narrator": "Umar bin Al-Khattab",\n'
                  "    },\n"
                  "    {\n"
                  '        "collection": "Sahih Muslim",\n'
                  '        "number": "223",\n'
                  '        "arabic": "الطُّهُورُ شَطْرُ الإِيمَانِ",\n'
                  '        "english": "Purity is half of faith.",\n'
                  '        "narrator": "Abu Malik Al-Ash\'ari",\n'
                  "    },\n"
                  "]\n\n"
                  "def fetch(book=None, number=None):\n"
                  '    candidates = [(book, "Sahih Hadith")] if book else random.sample(BOOKS, k=min(3, len(BOOKS)))\n'
                  "    for b_code, b_name in candidates:\n"
                  "        try:\n"
                  "            num = number if number else random.randint(1, 200)\n"
                  '            url = f"https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/eng-{b_code}/{num}.json"\n'
                  "            r = requests.get(url, timeout=12)\n"
                  "            if r.status_code == 200:\n"
                  "                data = r.json()\n"
                  '                eng_text = ""\n'
                  "                if isinstance(data, dict):\n"
                  '                    if "hadiths" in data and isinstance(data["hadiths"], list) and data["hadiths"]:\n'
                  '                        eng_text = str(data["hadiths"][0].get("text", "")).strip()\n'
                  '                    elif "text" in data:\n'
                  '                        eng_text = str(data.get("text", "")).strip()\n'
                  "                if eng_text:\n"
                  "                    return {\n"
                  '                        "collection": b_name,\n'
                  '                        "number": str(num),\n'
                  '                        "arabic": "",\n'
                  '                        "english": eng_text,\n'
                  '                        "narrator": b_name,\n'
                  "                    }\n"
                  "        except Exception:\n"
                  "            continue\n"
                  "    return random.choice(FALLBACK_HADITHS)\n"
              )
              fawaz_file.write_text(fawaz_src, encoding="utf-8")
              print("✅ Created Sources/fawaz.py")

          # 2. Universal bootstrap header so any script finds Sources, Fallback, Intro, Outro, CTA, Story, Uploader, Assets_Config
          BOOTSTRAP_BLOCK = (
              "# --- AUTO PATH BOOTSTRAP ---\n"
              "import os as _os, sys as _sys\n"
              "_HERE = _os.path.dirname(_os.path.abspath(__file__))\n"
              "_ROOT = _HERE\n"
              "for _ in range(4):\n"
              "    if _os.path.isdir(_os.path.join(_ROOT, 'Sources')) and _os.path.isdir(_os.path.join(_ROOT, 'Story')):\n"
              "        break\n"
              "    _ROOT = _os.path.dirname(_ROOT)\n"
              "for _sub in ['', 'Sources', 'Sources/Fallback', 'Sources/Intro', 'Sources/Outro', 'Sources/CTA', 'Assets_Config', 'Story', 'Story/Uploader']:\n"
              "    _p = _os.path.join(_ROOT, _sub) if _sub else _ROOT\n"
              "    if _os.path.isdir(_p) and _p not in _sys.path:\n"
              "        _sys.path.insert(0, _p)\n"
              "# --- END AUTO PATH BOOTSTRAP ---\n"
          )

          # 3. Direct replacements for old folder strings
          replacements = [
              ('os.path.dirname(os.path.dirname(CURRENT_DIR))', 'os.path.dirname(CURRENT_DIR)'),
              ('os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))', 'os.path.dirname(os.path.dirname(os.path.abspath(__file__)))'),
              ('os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(__file__))), "URL", "Islamic")', 'os.path.join(_ROOT, "Sources")'),
              ('os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(__file__))), "URL", "TTS_Translation")', 'os.path.join(_ROOT, "Sources")'),
              ('os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(__file__))), "Uploader")', 'os.path.join(_ROOT, "Story", "Uploader")'),
              ('os.path.join(dev_root, "API", "AI_Models")', 'os.path.join(_ROOT, "Sources", "Fallback")'),
              ('os.path.join(DEV_ROOT, "API", "Video_Sources")', 'os.path.join(_ROOT, "Sources", "Fallback")'),
              ('"API/AI_Models"', '"Sources/Fallback"'),
              ('"API/Video_Sources"', '"Sources/Fallback"'),
              ('"API/Music_Sources"', '"Sources/Fallback"'),
              ('"API/Photo_Sources"', '"Sources"'),
              ('"API/Islamic_Content"', '"Sources/Fallback"'),
              ('"API/Audio_Text"', '"Sources/Intro"'),
              ('"URL/Media"', '"Sources"'),
              ('"URL/Islamic"', '"Sources"'),
              ('"URL/TTS_Translation"', '"Sources"'),
              ('"URL/Text_Content"', '"Sources"'),
              ('"Story/Pipeline_Orchestration"', '"Story"'),
              ('"Story/Final_Render"', '"Story"'),
              ('"Story/Subtitles_Text"', '"Story"'),
              ('"Story/Thumbnails"', '"Sources/CTA"'),
              ('"Uploader"', '"Story/Uploader"'),
              ('"Config/App_Configs"', '"Assets_Config"'),
              ('"Assets"', '"Assets_Config"'),
              ("'Assets'", "'Assets_Config'"),
          ]

          for py_file in sorted(ROOT.rglob("*.py")):
              if ".git" in py_file.parts or py_file.name == "__init__.py":
                  continue
              txt = py_file.read_text(encoding="utf-8", errors="ignore")
              new_txt = txt
              for old, new in replacements:
                  new_txt = new_txt.replace(old, new)
              if "# --- AUTO PATH BOOTSTRAP ---" not in new_txt:
                  new_txt = BOOTSTRAP_BLOCK + "\n" + new_txt
              if new_txt != txt:
                  py_file.write_text(new_txt, encoding="utf-8")
                  print(f"🔧 Patched: {py_file.relative_to(ROOT)}")
              # Compile check to ensure valid Python syntax
              py_compile.compile(str(py_file), doraise=True)

          print("✅ All Python files compiled cleanly with zero syntax errors!")
          PYEOF

      - name: 5. 💾 Save & Push Fixed Code to Development Repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ Code already up-to-date."
          else
            git commit -m "fix: add fawaz.py and update all module/asset paths for root layout"
            git push
          fi

      - name: 6. 🎬 Run Story Pipeline Now
        working-directory: Story
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/Sources:${{ github.workspace }}/Sources/Fallback:${{ github.workspace }}/Sources/Intro:${{ github.workspace }}/Sources/Outro:${{ github.workspace }}/Sources/CTA:${{ github.workspace }}/Assets_Config:${{ github.workspace }}/Story:${{ github.workspace }}/Story/Uploader"
        run: |
          echo "🚀 Starting Story Pipeline..."
          python -u composer.py

      - name: 7. 🧹 Cleanup Temp Files
        if: always()
        run: rm -rf Story/temp temp 2>/dev/null || true
