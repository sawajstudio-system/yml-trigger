name: 🔧 Add Sources/fawaz.py & Fix Old Paths in Development (One-Time)

on:
  workflow_dispatch:

jobs:
  fix_paths:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 🧩 Create Sources/fawaz.py & Update Old Paths Safely
        run: |
          python3 - <<'PYEOF'
          import base64
          from pathlib import Path

          ROOT = Path(".").resolve()
          sources_dir = ROOT / "Sources"
          sources_dir.mkdir(parents=True, exist_ok=True)

          fawaz_file = sources_dir / "fawaz.py"
          if not fawaz_file.exists():
              fawaz_src = (
                  "import random\n"
                  "import requests\n\n"
                  "BOOKS = [\n"
                  '    ("bukhari", "Sahih al-Bukhari"),\n'
                  '    ("muslim", "Sahih Muslim"),\n'
                  '    ("abudawud", "Sunan Abi Dawud"),\n'
                  '    ("tirmidhi", "Jami at-Tirmidhi"),\n'
                  '    ("nasai", "Sunan an-Nasa\'i"),\n'
                  '    ("ibnmajah", "Sunan Ibn Majah"),\n'
                  "]\n\n"
                  "FALLBACK_HADITHS = [\n"
                  "    {\n"
                  '        "collection": "Sahih al-Bukhari",\n'
                  '        "number": "1",\n'
                  '        "arabic": "إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ",\n'
                  '        "english": "The reward of deeds depends upon the intentions and every person will get the reward according to what he has intended.",\n'
                  '        "narrator": "Umar bin Al-Khattab",\n'
                  "    },\n"
                  "    {\n"
                  '        "collection": "Sahih Muslim",\n'
                  '        "number": "223",\n'
                  '        "arabic": "الطُّهُورُ شَطْرُ الإِيمَانِ",\n'
                  '        "english": "Purity is half of faith.",\n'
                  '        "narrator": "Abu Malik Al-Ash\'ari",\n'
                  "    },\n"
                  "]\n\n"
                  "def fetch(book=None, number=None):\n"
                  '    candidates = [(book, "Sahih Hadith")] if book else random.sample(BOOKS, k=min(3, len(BOOKS)))\n'
                  "    for b_code, b_name in candidates:\n"
                  "        try:\n"
                  "            num = number if number else random.randint(1, 200)\n"
                  '            url = f"https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/eng-{b_code}/{num}.json"\n'
                  "            r = requests.get(url, timeout=12)\n"
                  "            if r.status_code == 200:\n"
                  "                data = r.json()\n"
                  '                eng_text = ""\n'
                  "                if isinstance(data, dict):\n"
                  '                    if "hadiths" in data and isinstance(data["hadiths"], list) and data["hadiths"]:\n'
                  '                        eng_text = str(data["hadiths"][0].get("text", "")).strip()\n'
                  '                    elif "text" in data:\n'
                  '                        eng_text = str(data.get("text", "")).strip()\n'
                  "                if eng_text:\n"
                  "                    return {\n"
                  '                        "collection": b_name,\n'
                  '                        "number": str(num),\n'
                  '                        "arabic": "",\n'
                  '                        "english": eng_text,\n'
                  '                        "narrator": b_name,\n'
                  "                    }\n"
                  "        except Exception:\n"
                  "            continue\n"
                  "    return random.choice(FALLBACK_HADITHS)\n"
              )
              fawaz_file.write_text(fawaz_src, encoding="utf-8")
              print("✅ Created Sources/fawaz.py")

