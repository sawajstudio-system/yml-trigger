name: 🗑️ Delete Old Folders from Development Repo

on:
  workflow_dispatch:

jobs:
  cleanup_old_folders:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 🗑️ Remove Old Folders
        run: |
          python3 - <<'PYEOF'
          import shutil
          from pathlib import Path

          ROOT = Path(".").resolve()
          old_folders = ["API", "Assets", "Config", "Story", "URL", "Uploader"]

          for folder in old_folders:
              p = ROOT / folder
              if p.exists() and p.is_dir():
                  shutil.rmtree(p)
                  print(f"Deleted: {folder}/")
              else:
                  print(f"Not found (already clean): {folder}/")
          PYEOF

      - name: 💾 Commit & Push Deletions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          git commit -m "chore: remove old folders after migrating to Deployment/" || echo "Nothing to commit"
          git push
