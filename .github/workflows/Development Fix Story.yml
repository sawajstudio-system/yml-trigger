name: ♻️ Restore Development to Commit 93d66a7

on:
  workflow_dispatch:

jobs:
  restore_commit:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: ♻️ Checkout Full Tree from 93d66a7
        run: |
          set -e
          git checkout 93d66a7 -- .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit."
          else
            git commit -m "chore: restore full project tree from 93d66a7"
            git push
          fi
