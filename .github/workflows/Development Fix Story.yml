name: ♻️ Restore Development Repo Files

on:
  workflow_dispatch:
    inputs:
      commit_ref:
        description: "Kis commit par wapas jana hai? (Default: HEAD~1)"
        required: false
        default: "HEAD~1"
        type: string

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: ♻️ Restore Files from Previous Commit
        env:
          COMMIT_REF: ${{ inputs.commit_ref }}
        run: |
          git log -n 5 --oneline
          REF="${COMMIT_REF:-HEAD~1}"
          echo "Restoring tree to: $REF"
          git checkout "$REF" -- .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          git commit -m "chore: restore Development files from $REF" || echo "Nothing to commit"
          git push
          
