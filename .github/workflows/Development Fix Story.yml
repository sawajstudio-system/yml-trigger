name: 🗑️ Delete Deployment Folder from Development Repo

on:
  workflow_dispatch:

jobs:
  delete_deployment:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 🗑️ Delete Root Deployment/ Folder
        run: |
          python3 - <<'PYEOF'
          import shutil
          from pathlib import Path

          target = Path(".").resolve() / "Deployment"
          if target.exists() and target.is_dir():
              shutil.rmtree(target)
              print("✅ Deleted root Deployment/ folder.")
          else:
              print("⚠️ Deployment/ folder not found at root.")
          PYEOF

      - name: 💾 Commit & Push Deletion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove incorrect Deployment folder" || echo "Nothing to commit"
          git push
