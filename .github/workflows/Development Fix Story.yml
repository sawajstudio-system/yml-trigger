name: 🧹 Delete Only One Subfolder Inside Development Repo

on:
  workflow_dispatch:
    inputs:
      subfolder_name:
        description: "Development repo ke andar kaunsa 1 galat folder hatana hai? (Default: Deployment)"
        required: false
        default: "Deployment"
        type: string

jobs:
  remove_only_subfolder:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 🧹 Remove Only Specified Subfolder
        env:
          SUBFOLDER: ${{ inputs.subfolder_name }}
        run: |
          set -e
          NAME="$(echo "$SUBFOLDER" | xargs)"
          NAME="${NAME#/}"
          NAME="${NAME%/}"

          if [ -z "$NAME" ] || [ "$NAME" = "." ] || [ "$NAME" = ".." ]; then
            echo "❌ Invalid folder name: '$SUBFOLDER'"
            exit 1
          fi

          if [ -e "$NAME" ]; then
            git rm -r --ignore-unmatch "$NAME"
            rm -rf "$NAME"
            echo "✅ Removed only '$NAME/' inside Development repo."
          else
            echo "ℹ️ '$NAME/' does not exist in Development repo."
          fi

          git status --short

      - name: 💾 Commit & Push Only That Change
        env:
          SUBFOLDER: ${{ inputs.subfolder_name }}
        run: |
          set -e
          NAME="$(echo "$SUBFOLDER" | xargs)"
          NAME="${NAME#/}"
          NAME="${NAME%/}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit."
          else
            git commit -m "chore: remove folder $NAME inside Development"
            git push
          fi
