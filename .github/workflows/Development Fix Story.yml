name: ♻️ Step 1 - Restore All Old Folders to Development

on:
  workflow_dispatch:

jobs:
  restore_old:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 🔍 Find Commit Before Deployment Deletion & Restore
        run: |
          set -e
          git log -n 10 --oneline
          # Find the most recent commit that has API/ or Story/
          GOOD_COMMIT=$(git rev-list -n 15 HEAD -- API Story Assets Config URL Uploader | head -n 1)
          echo "Found commit with old folders: $GOOD_COMMIT"
          if [ -z "$GOOD_COMMIT" ]; then
            echo "❌ Could not find a commit with old folders in history."
            exit 1
          fi
          git checkout "$GOOD_COMMIT" -- API Assets Config Story URL Uploader .gitignore requirements.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit."
          else
            git commit -m "chore: restore API, Assets, Config, Story, URL, Uploader from $GOOD_COMMIT"
            git push
          fi
          
