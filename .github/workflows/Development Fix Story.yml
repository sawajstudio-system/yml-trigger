name: 🎨 Update 3-Lang Subtitle Style & Run Story

on:
  workflow_dispatch:

concurrency:
  group: story-pipeline
  cancel-in-progress: false

jobs:
  update_and_run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - name: 1. Checkout & Setup
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. Python & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto fonts-noto-color-emoji fontconfig && sudo fc-cache -f -v
          python -m pip install --upgrade pip
          [ -f "requirements.txt" ] && pip install -r requirements.txt || pip install requests edge-tts google-api-python-client google-auth-httplib2 google-auth-oauthlib Pillow mutagen numpy PyYAML

      - name: 3. Write 3-Lang + Dot + Gradient Bar ass_builder.py
        run: |
          mkdir -p Story
          python3 - <<'PY'
          import base64
          b64 = (
              "aW1wb3J0IG9zLCByZQoKRFlOTV9ET1RTID0gWyImSDAwMzg5OEZGJiIsICImSDAwRkZDQzQ0JiIsICImSDAwMThCOEZGJiIsICImSDAwNzhGRjg4JiIsICImSDAwRkY3OEVCJiIsICImSDAwRkZGRjY2JiJdCgp"
              "RE9UX1BBTEVUVEUgPSBbIiZIMDAzODk4RkYmIiwgIiZIMDBGQkNDNDQmIiwgIiZIMDAxOEI4RkYmIiwgIiZIMDA3OEZGODgmIiwgIiZIMDBGQjc4RTgmIiwgIiZIMDBGUEZGRjY2JiJdCgp"
              "V09SRF9QQUxFVFRFID0gWyImSDAwRkZDQzQ0JiIsICImSDAwODhGRjk5JiIsICImSDAwMjJFOEZGJiIsICImSDAwRkY3OEVCJiIsICImSDAwNTVBQUZGJiIsICImSDAwRkZGRjY2JiIsICImSDAwRkZBOEY2JiJdCgp"
              ""
          )
          PY

      - name: 4. Save to Development & Run Story
        working-directory: Story
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/Sources:${{ github.workspace }}/Sources/Fallback:${{ github.workspace }}/Sources/Intro:${{ github.workspace }}/Sources/Outro:${{ github.workspace }}/Sources/CTA:${{ github.workspace }}/Assets_Config:${{ github.workspace }}/Story:${{ github.workspace }}/Story/Uploader"
        run: |
          cd "${{ github.workspace }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "style: 3-lang dots and gradient bars" && git push)
          cd "${{ github.workspace }}/Story"
          python -u composer.py

      - name: 5. Cleanup
        if: always()
        run: rm -rf Story/temp temp 2>/dev/null || true
