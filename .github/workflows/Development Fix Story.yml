name: 📂 Move Sources, Assets_Config & Story to Development Root (One-Time)

on:
  workflow_dispatch:

jobs:
  flatten_root:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 📂 Move Inner Folders Directly to Root & Remove Deployment Wrapper
        run: |
          python3 - <<'PYEOF'
          import shutil
          from pathlib import Path

          ROOT = Path(".").resolve()
          DEPLOY = ROOT / "Deployment"

          if DEPLOY.exists() and DEPLOY.is_dir():
              for item in list(DEPLOY.iterdir()):
                  dest = ROOT / item.name
                  if item.is_dir():
                      shutil.copytree(item, dest, dirs_exist_ok=True)
                      shutil.rmtree(item)
                      print(f"Moved folder to Development root: {item.name}/")
                  else:
                      if item.name not in {".gitignore", "requirements.txt"}:
                          if not dest.exists():
                              shutil.copy2(item, dest)
                      item.unlink()

              # Remove Deployment wrapper folder if empty
              if DEPLOY.exists() and not any(DEPLOY.iterdir()):
                  DEPLOY.rmdir()
                  print("Removed empty Deployment/ wrapper folder.")

          # Ensure no accidental Development/ subfolder exists inside Development repo
          accidental_dev = ROOT / "Development"
          if accidental_dev.exists() and accidental_dev.is_dir():
              for item in list(accidental_dev.iterdir()):
                  dest = ROOT / item.name
                  if item.is_dir():
                      shutil.copytree(item, dest, dirs_exist_ok=True)
                      shutil.rmtree(item)
                  else:
                      if not dest.exists():
                          shutil.copy2(item, dest)
                      item.unlink()
              if not any(accidental_dev.iterdir()):
                  accidental_dev.rmdir()
                  print("Removed accidental inner Development/ folder.")

          print("Root items now:", sorted(p.name for p in ROOT.iterdir() if p.name != ".git"))
          PYEOF

      - name: 💾 Commit & Push Flattened Root to Development
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ Nothing to commit."
          else
            git commit -m "chore: place Sources, Assets_Config, and Story directly at Development root"
            git push
          fi
