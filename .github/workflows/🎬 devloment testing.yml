name: 🎬 devloment testing Story

on:
  workflow_dispatch:

concurrency:
  group: story-pipeline
  cancel-in-progress: false

jobs:
  run_video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # ── 🟢 CORE & API KEYS ──
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

      # ── ☁️ GOOGLE DRIVE ──
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}

      # ── 🧠 AI MODELS ──
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}

      # ── 🎬 MEDIA & AUDIO ──
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - name: 1. 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 📦 Install FFmpeg & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto fonts-noto-color-emoji fontconfig
          sudo fc-cache -f -v

      - name: 4. 📥 Install Python Packages
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "Story/requirements.txt" ]; then
            pip install -r Story/requirements.txt
          else
            pip install requests edge-tts google-api-python-client google-auth-httplib2 google-auth-oauthlib Pillow mutagen numpy PyYAML
          fi

      - name: 5. 🔍 Verify Structure
        run: |
          echo "📂 Story subfolders:"
          find Story -maxdepth 2 -type f | sort
          echo ""
          echo "📂 Assets:"
          ls -la Assets/

      - name: 6. 🎬 Run Story Pipeline
        working-directory: Story/Pipeline_Orchestration
        env:
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/API/AI_Models:${{ github.workspace }}/API/Video_Sources:${{ github.workspace }}/API/Music_Sources:${{ github.workspace }}/API/Photo_Sources:${{ github.workspace }}/API/Islamic_Content:${{ github.workspace }}/API/Audio_Text:${{ github.workspace }}/URL/Media:${{ github.workspace }}/URL/Islamic:${{ github.workspace }}/URL/TTS_Translation:${{ github.workspace }}/URL/Text_Content:${{ github.workspace }}/Story/Pipeline_Orchestration:${{ github.workspace }}/Story/Final_Render:${{ github.workspace }}/Story/Subtitles_Text:${{ github.workspace }}/Story/Thumbnails:${{ github.workspace }}/Uploader:${{ github.workspace }}/Config/App_Configs"
        run: |
          echo "🚀 Starting Story Pipeline..."
          python -u composer.py

      - name: 7. 📤 Check Output
        if: always()
        run: |
          VIDEO="Story/Pipeline_Orchestration/temp/Final_Story.mp4"
          if [ -f "$VIDEO" ]; then
            echo "✅ VIDEO BANA!"
            du -h "$VIDEO"
          else
            echo "ℹ️ Pipeline completed (temp/ may already be cleaned up after Drive upload)."
            ls -la Story/Pipeline_Orchestration/ 2>/dev/null || true
          fi

      - name: 8. 🧹 Cleanup
        if: always()
        run: rm -rf Story/Pipeline_Orchestration/temp Story/temp temp 2>/dev/null || true
