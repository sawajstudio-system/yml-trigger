name: 🎬 SAWAJ STUDIO Story Pipeline

on:
  workflow_dispatch:

concurrency:
  group: story-pipeline
  cancel-in-progress: false

jobs:
  run_video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # ── 🟢 CORE & API KEYS ──
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

      # ── ☁️ GOOGLE DRIVE ──
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}

      # ── 🧠 AI MODELS ──
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}

      # ── 🎬 MEDIA & AUDIO ──
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - name: 1. 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 📦 Install FFmpeg & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto fonts-noto-color-emoji fontconfig
          sudo fc-cache -f -v

      - name: 4. 📥 Install Python Packages
        run: |
          python -m pip install --upgrade pip
          if [ -f "bot/requirements.txt" ]; then
            pip install -r bot/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install requests edge-tts google-api-python-client google-auth-httplib2 google-auth-oauthlib Pillow mutagen numpy PyYAML
          fi

      - name: 5. 🔍 Verify bot/ Structure
        run: |
          echo "📂 provider_1:"
          find bot/provider_1 -maxdepth 2 -type f | sort
          echo ""
          echo "📂 assets_2:"
          find bot/assets_2 -maxdepth 2 -type f | sort
          echo ""
          echo "📂 video_generator_3/story_3:"
          find bot/video_generator_3/story_3 -maxdepth 2 -type f | sort
          echo ""
          echo "📂 upload_4/gdrive_1:"
          find bot/upload_4/gdrive_1 -maxdepth 2 -type f | sort

      - name: 6. 🎬 Run Story Pipeline
        working-directory: bot/video_generator_3/story_3/trigger_1
        env:
          PYTHONPATH: "${{ github.workspace }}/bot:${{ github.workspace }}/bot/provider_1/clients_1:${{ github.workspace }}/bot/provider_1/tts_2:${{ github.workspace }}/bot/provider_1/engines_3:${{ github.workspace }}/bot/provider_1/hadith_4:${{ github.workspace }}/bot/provider_1/quran_5:${{ github.workspace }}/bot/provider_1/calendar_6:${{ github.workspace }}/bot/provider_1/filters_7:${{ github.workspace }}/bot/provider_1/glossaries_8:${{ github.workspace }}/bot/provider_1/templates_9:${{ github.workspace }}/bot/provider_1/thumbnails_10:${{ github.workspace }}/bot/provider_1/config_11:${{ github.workspace }}/bot/provider_1/fallback_12:${{ github.workspace }}/bot/assets_2:${{ github.workspace }}/bot/assets_2/fonts_4:${{ github.workspace }}/bot/assets_2/logos_5:${{ github.workspace }}/bot/video_generator_3/story_3/trigger_1:${{ github.workspace }}/bot/video_generator_3/story_3/script_2:${{ github.workspace }}/bot/video_generator_3/story_3/render_3:${{ github.workspace }}/bot/video_generator_3/story_3/outputs_4:${{ github.workspace }}/bot/video_generator_3/story_3/uploader_5:${{ github.workspace }}/bot/upload_4/gdrive_1/story_video_upload_3"
        run: |
          echo "🚀 Starting SAWAJ STUDIO Story Pipeline..."
          python -u composer.py

      - name: 7. 📤 Check Output
        if: always()
        run: |
          VIDEO="bot/video_generator_3/story_3/trigger_1/temp/Final_Story.mp4"
          if [ -f "$VIDEO" ]; then
            echo "✅ VIDEO BANA!"
            du -h "$VIDEO"
          else
            echo "ℹ️ Pipeline completed (temp/ may already be cleaned up after Drive upload)."
            ls -la bot/video_generator_3/story_3/outputs_4/ 2>/dev/null || true
          fi

      - name: 8. 🧹 Cleanup
        if: always()
        run: rm -rf bot/video_generator_3/story_3/trigger_1/temp bot/assets_2/temp_7/temp temp 2>/dev/null || true
