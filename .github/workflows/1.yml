                  {"card_bg": (34, 12, 18, 215), "border": (245, 185, 95, 245), "glow": (245, 185, 95, 120), "header": "#FFF0C2", "btns": ["#F7C548", "#FFB4A2", "#E9C46A", "#F4A261"], "footer": "#E9C46A"},
                  {"card_bg": (18, 22, 18, 215), "border": (175, 235, 145, 245), "glow": (140, 225, 120, 120), "header": "#E6FFD6", "btns": ["#B7E4C7", "#FFE169", "#95D5B2", "#F9C74F"], "footer": "#B7E4C7"},
              ]
