                  print(f"[pixabay_music] ✅ Sine fallback saved to {output_path}")
                  return output_path
              except Exception as e:
                  print(f"[pixabay_music] ❌ Sine fallback failed: {e}")
                  return None
          def _download_and_process(audio_url, duration, output_path):
              try:
                  print(f"[pixabay_music] 📥 Downloading: {audio_url[:50]}...")
