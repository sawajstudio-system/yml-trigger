                  return render_final_video(bg_video, music_path, voice_path, ass_path, cta_img, total_dur, output_path=output_path, fonts_dir=FONTS_DIR)
              """)

              # trigger_1/composer.py
              write_py(f"{base}/trigger_1/composer.py", f"""
              import os, subprocess, random, shutil, traceback, requests
              from concurrent.futures import ThreadPoolExecutor
              from PIL import Image, ImageDraw, ImageFont, ImageFilter
              import numpy as np

              from all_ai_fallback import generate_text as ai_generate
              from fawaz import fetch as fetch_hadith
              from mymemory import translate as translate_hindi
              from edge_tts import generate as edge_tts_generate
              from elevenlabs import generate as elevenlabs_tts
              from pexels_video import fetch as pexels_video
              from pixabay_video import fetch as pixabay_video
              from coverr import fetch as coverr_video
              from gradient import fetch as gradient_video
              from freesound import fetch as freesound_music
              from pixabay_music import fetch as pixabay_music
              from final_upload import upload as upload_video
              from render_video import build_and_render
              from duration import get_audio_duration as _get_dur

              MODE_NAME = "{cfg['mode_name']}"
              WIDTH, HEIGHT = {cfg['width']}, {cfg['height']}
              ORIENTATION = "{cfg['orientation']}"
              WORD_RANGE = "{cfg['word_range']}"
              MAX_TOKENS = {cfg['max_tokens']}
              CLIP_COUNT = {cfg['clip_count']}
              OUTPUT_FILE = "{cfg['output_file']}"

              HADITH_BOOKS_META = {{
                  "bukhari": ("सहीह अल-बुखारी", "इमाम मुहम्मद अल-बुखारी"),
                  "muslim": ("सहीह मुस्लिम", "इमाम मुस्लिम इब्न अल-हज्जाज"),
                  "abudawud": ("सुनन अबू दाऊद", "इमाम अबू दाऊद"),
                  "tirmidhi": ("जामिअ अत-तिर्मिज़ी", "इमाम मुहम्मद अत-तिर्मिज़ी"),
                  "nasai": ("सुनन अन-नसाई", "इमाम अहमद अन-नसाई"),
                  "ibnmajah": ("सुनन इब्ने माजा", "इमाम मुहम्मद इब्ने माजा"),
              }}

              def get_hadith_book_details(hadith_info):
                  raw_col = str((hadith_info or {{}}).get("collection") or "").strip()
                  key = raw_col.lower()
                  for k, v in HADITH_BOOKS_META.items():
                      if k in key:
                          return v[0], v[1], str((hadith_info or {{}}).get("number") or "").strip()
                  return (raw_col or "हदीस शरीफ़"), "हदीस संकलनकर्ता", str((hadith_info or {{}}).get("number") or "").strip()

              def send_telegram(msg):
                  t, c = os.getenv("TELEGRAM_API_REPORT_TOKEN"), os.getenv("TELEGRAM_API_REPORT_CHAT_ID")
                  if t and c:
                      try:
                          requests.post(f"https://api.telegram.org/bot{{t}}/sendMessage", json={{"chat_id": c, "text": msg[:4000], "parse_mode": "HTML"}}, timeout=10)
                      except Exception:
                          pass

              def load_font(font_path, size):
                  try: return ImageFont.truetype(font_path, size)
                  except Exception:
                      for fb in ["/usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]:
                          try: return ImageFont.truetype(fb, size)
                          except Exception: continue
                      return ImageFont.load_default()

              def draw_gold_text(base_img, text, font_path, font_size, y_pos):
                  if not text: return
                  font = load_font(font_path, font_size)
                  bbox = ImageDraw.Draw(Image.new("RGBA", base_img.size)).textbbox((0, 0), text, font=font)
                  tw, th = max(1, bbox[2] - bbox[0]), max(1, bbox[3] - bbox[1])
                  x = (base_img.width - tw) // 2
                  c_top, c_mid, c_bot = np.array([255, 248, 190]), np.array([218, 178, 60]), np.array([142, 102, 12])
                  grad = np.zeros((th, tw, 4), dtype=np.uint8)
                  half = max(1, th / 2.0)
                  for i in range(th):
                      col = c_top * (1 - i / half) + c_mid * (i / half) if i < th // 2 else c_mid * (1 - (i - th / 2.0) / half) + c_bot * ((i - th / 2.0) / half)
                      grad[i, :] = [int(col[0]), int(col[1]), int(col[2]), 255]
                  mask = Image.new("L", (tw, th), 0)
                  ImageDraw.Draw(mask).text((-bbox[0], -bbox[1]), text, font=font, fill=255)
                  gold_txt = Image.new("RGBA", (tw, th), (0, 0, 0, 0))
                  gold_txt.paste(Image.fromarray(grad, "RGBA"), (0, 0), mask)
                  base_img.paste(gold_txt, (x, y_pos), gold_txt)

              def generate_intro_outro_clip(output_path, duration, is_intro, hadith_info=None):
                  bg = Image.new("RGB", (WIDTH, HEIGHT), (0, 0, 0))
                  fonts_dir = os.path.join(_BOT, "display_assets_2", "fonts_4")
                  hi_font, en_font = os.path.join(fonts_dir, "YatraOne.ttf"), os.path.join(fonts_dir, "PlayfairDisplay.ttf")
                  book_hi, _, h_num = get_hadith_book_details(hadith_info)
                  ref_line = f"{{str((hadith_info or {{}}).get('collection', 'HADITH')).upper()}} • #{{h_num}}" if h_num else "HADITH"
                  cy = HEIGHT // 2
                  if is_intro:
                      draw_gold_text(bg, "SAWAJSTUDIO", en_font, 86, cy - 150)
                      draw_gold_text(bg, book_hi, hi_font, 50, cy - 20)
                      draw_gold_text(bg, ref_line, en_font, 42, cy + 70)
                  else:
                      draw_gold_text(bg, "SAWAJSTUDIO", en_font, 82, cy - 70)
                      draw_gold_text(bg, "JAZAKALLAH KHAIR", en_font, 46, cy + 50)
                  os.makedirs("temp", exist_ok=True)
                  tmp_jpg = f"temp/static_{{'intro' if is_intro else 'outro'}}.jpg"
                  bg.save(tmp_jpg)
                  cmd = f'ffmpeg -y -loop 1 -i "{{tmp_jpg}}" -vf "scale={{WIDTH}}:{{HEIGHT}},fps=24,setsar=1,fade=t=in:st=0:d=1.2,fade=t=out:st={{max(0.1, duration-1.0):.2f}}:d=1.0" -t {{duration}} -c:v libx264 -preset ultrafast -crf 20 -pix_fmt yuv420p "{{output_path}}"'
                  try:
                      subprocess.run(cmd, shell=True, check=True, capture_output=True)
                      if os.path.exists(tmp_jpg): os.remove(tmp_jpg)
                      return output_path
                  except Exception:
                      return None

              def download_and_normalize(args):
                  i, query, clip_dur, clip_path = args
                  raw = f"temp/raw_clip_{{i}}.mp4"
                  api_used = "Failed"
                  if pexels_video(query=query, duration=clip_dur, output_path=raw, orientation=ORIENTATION): api_used = "Pexels"
                  elif pixabay_video(query=query, duration=clip_dur, output_path=raw, orientation=ORIENTATION): api_used = "Pixabay"
                  elif coverr_video(query=query, duration=clip_dur, output_path=raw, orientation=ORIENTATION): api_used = "Coverr"
                  elif gradient_video(duration=clip_dur, output_path=raw, resolution=f"{{WIDTH}}x{{HEIGHT}}"): api_used = "Gradient"
                  if not os.path.exists(raw): return (False, "Failed")
                  cmd = f'ffmpeg -y -i "{{raw}}" -vf "scale={{WIDTH}}:{{HEIGHT}}:force_original_aspect_ratio=increase,crop={{WIDTH}}:{{HEIGHT}},fps=24,setsar=1" -an -c:v libx264 -preset ultrafast -crf 30 -threads 0 "{{clip_path}}"'
                  subprocess.run(cmd, shell=True, capture_output=True, timeout=180)
                  if os.path.exists(raw): os.remove(raw)
                  return (os.path.exists(clip_path) and os.path.getsize(clip_path) > 10000, api_used)

              def run_pipeline():
                  send_telegram(f"🚀 <b>{{MODE_NAME}} Video Generation Started!</b>")
                  os.makedirs("temp", exist_ok=True)
                  hadith = fetch_hadith()
                  if not hadith: return send_telegram(f"❌ [{{MODE_NAME}}] Hadith fetch failed.")
                  english_text = hadith.get("english", "")
                  prompt = f"Translate this Hadith to Hindi and explain its deep Islamic moral lesson in detail. Total {{WORD_RANGE}} words. Only Hindi text.\\n\\nHadith: {{english_text}}"
                  hindi_text = ai_generate(prompt, max_tokens=MAX_TOKENS) or translate_hindi(english_text)
                  if not hindi_text or not any("\\u0900" <= ch <= "\\u097F" for ch in hindi_text):
                      return send_telegram(f"❌ [{{MODE_NAME}}] Hindi generation failed.")

                  book_hi, author_hi, h_num = get_hadith_book_details(hadith)
                  prefix = f"यह हदीस {{book_hi}} की किताब है, जिसे {{author_hi}} ने संकलित किया है।" + (f" हदीस नंबर {{h_num}}।" if h_num else "")
                  full_narration = f"{{prefix}} {{hindi_text}}".strip()

                  voice_path, slowed_path = "temp/voice.mp3", "temp/voice_slowed.mp3"
                  voice_used = "ElevenLabs" if elevenlabs_tts(full_narration, voice_path) else ("Edge-TTS" if edge_tts_generate(full_narration, voice_path) else None)
                  if not voice_used: return send_telegram(f"❌ [{{MODE_NAME}}] Voice failed.")
                  subprocess.run(f'ffmpeg -y -i "{{voice_path}}" -filter:a "atempo=0.82" -vn "{{slowed_path}}"', shell=True, capture_output=True, timeout=60)
                  if os.path.exists(slowed_path): voice_path = slowed_path

                  est_dur = max(25.0, float(_get_dur(voice_path)) + 10.0)
                  per_clip = max(12.0, round(est_dur / CLIP_COUNT, 2))
                  queries = random.sample([
                      "islamic mosque architecture", "holy quran book pages", "stars night sky",
                      "ocean waves sunset", "desert sand dunes", "green mountains waterfall",
                      "clouds moving sky", "forest trees sunlight", "kaaba mecca", "madina green dome"
                  ], k=CLIP_COUNT)
                  with ThreadPoolExecutor(max_workers=3) as ex:
                      results = list(ex.map(download_and_normalize, [(i, q, per_clip, f"temp/clip_{{i}}.mp4") for i, q in enumerate(queries)]))

                  concat_list, valid_clips, apis = "temp/concat.txt", [], set()
                  with open(concat_list, "w") as f:
                      for i, (ok, api) in enumerate(results):
                          if ok:
                              valid_clips.append(f"temp/clip_{{i}}.mp4")
                              apis.add(api)
                              f.write(f"file '{{os.path.abspath(f'temp/clip_{{i}}.mp4')}}'\\n")
                  if not valid_clips: return send_telegram(f"❌ [{{MODE_NAME}}] Background clips failed.")

                  bg_video = "temp/bg_video.mp4"
                  subprocess.run(f'ffmpeg -y -f concat -safe 0 -i "{{concat_list}}" -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p "{{bg_video}}"', shell=True, capture_output=True, timeout=240)

                  intro_v, outro_v = "temp/pro_intro.mp4", "temp/pro_outro.mp4"
                  has_in = generate_intro_outro_clip(intro_v, 4.0, True, hadith)
                  has_out = generate_intro_outro_clip(outro_v, 4.0, False, hadith)
                  if has_in or has_out:
                      io_list, merged = "temp/io.txt", "temp/bg_merged.mp4"
                      with open(io_list, "w") as f:
                          if has_in: f.write(f"file '{{os.path.abspath(intro_v)}}'\\n")
                          f.write(f"file '{{os.path.abspath(bg_video)}}'\\n")
                          if has_out: f.write(f"file '{{os.path.abspath(outro_v)}}'\\n")
                      subprocess.run(f'ffmpeg -y -f concat -safe 0 -i "{{io_list}}" -c:v libx264 -preset ultrafast -crf 25 -pix_fmt yuv420p "{{merged}}"', shell=True, capture_output=True, timeout=240)
                      if os.path.exists(merged): bg_video = merged

                  music_path = "temp/music.mp3"
                  music_used = "Freesound" if freesound_music(duration=int(est_dur), output_path=music_path) else ("Pixabay" if pixabay_music(duration=int(est_dur), output_path=music_path) else "None")

                  final_out = os.path.join(_BOT, "video_generator_3", "{folder_key}", "outputs_4", OUTPUT_FILE)
                  rendered = build_and_render(bg_video, music_path if music_used != "None" else "", voice_path, hadith, hindi_text, output_path=final_out)
                  if not rendered: return send_telegram(f"❌ [{{MODE_NAME}}] Render failed.")

                  link = upload_video(final_out)
                  report = f"🎉 <b>{{MODE_NAME}} Video Ready!</b>\\n📜 <b>Book:</b> {{book_hi}} (#{{h_num}})\\n🎙️ <b>Voice:</b> {{voice_used}}\\n🎥 <b>Video:</b> {{', '.join(apis)}} ({{WIDTH}}x{{HEIGHT}})\\n🎵 <b>Music:</b> {{music_used}}"
                  if link: report += f"\\n📥 <a href='{{link}}'>Open in Google Drive</a>"
                  send_telegram(report)
                  shutil.rmtree("temp", ignore_errors=True)

              if __name__ == "__main__":
                  try:
                      run_pipeline()
                  except Exception:
                      send_telegram(f"💥 <b>[{{MODE_NAME}}] Crash!</b>\\n<pre>{{traceback.format_exc()[-1500:]}}</pre>")
              """)

