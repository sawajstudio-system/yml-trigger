          write_py("bot/provider_1/engines_3/pixabay_music.py", """
          import os, subprocess, requests
          def fetch(duration=60, output_path="temp/bg_music.mp3"):
              api_key = os.getenv("PIXABAY_API_KEY")
              if api_key:
                  url = f"https://pixabay.com/api/?key={api_key}&q=ambient+background&category=music"
                  try:
                      r = requests.get(url, timeout=15)
                      if r.status_code == 200:
                          hits = r.json().get("hits", [])
                          if hits and "audio" in hits[0]:
                              if _download_and_process(hits[0]["audio"], duration, output_path):
                                  return output_path
                  except Exception:
                      pass
              for url in [
                  "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=soft-ambient-112191.mp3",
                  "https://cdn.pixabay.com/download/audio/2022/03/24/audio_4f3b5c5e3d.mp3?filename=peaceful-background-112194.mp3"
              ]:
                  if _download_and_process(url, duration, output_path):
                      return output_path
              return _generate_sine_fallback(duration, output_path)
          def _generate_sine_fallback(duration, output_path):
              try:
                  os.makedirs(os.path.dirname(output_path) or "temp", exist_ok=True)
                  fade_out = max(duration - 3.0, 1.0)
                  cmd = f'ffmpeg -y -f lavfi -i "sine=frequency=110:duration={duration:.2f}" -af "afade=t=in:st=0:d=2,afade=t=out:st={fade_out:.2f}:d=3,volume=0.12" -c:a libmp3lame -b:a 192k "{output_path}"'
                  subprocess.run(cmd, shell=True, check=True, capture_output=True)
                  return output_path
              except Exception:
                  return None
          def _download_and_process(audio_url, duration, output_path):
              try:
                  audio_data = requests.get(audio_url, timeout=30).content
                  if len(audio_data) < 10000: return False
                  os.makedirs(os.path.dirname(output_path) or "temp", exist_ok=True)
                  raw_music = f"{output_path}.pixabay.raw.mp3"
                  with open(raw_music, "wb") as f: f.write(audio_data)
                  fade_out_start = max(duration - 3.0, 1.0)
                  cmd = f'ffmpeg -y -stream_loop -1 -i "{raw_music}" -af "volume=0.20,afade=t=in:st=0:d=2,afade=t=out:st={fade_out_start:.2f}:d=3" -t {duration:.2f} -c:a libmp3lame -b:a 192k "{output_path}"'
                  subprocess.run(cmd, shell=True, check=True, capture_output=True)
                  if os.path.exists(raw_music): os.remove(raw_music)
                  return True
              except Exception:
                  return False
          """)

          write_py("bot/provider_1/engines_3/mymemory.py", """
          import re, requests
          from all_ai_fallback import generate_text
          def translate(text, target_lang="hi"):
              if not text or len(text.strip()) < 2: return ""
              def _translate_one(chunk_text):
                  try:
                      r = requests.get("https://api.mymemory.translated.net/get", params={"q": chunk_text[:450], "langpair": f"en|{target_lang}"}, timeout=15)
                      if r.status_code == 200:
                          translated = r.json().get("responseData", {}).get("translatedText", "")
                          upper = translated.upper()
                          if translated and "MYMEMORY WARNING" not in upper and "QUERY LENGTH LIMIT" not in upper:
                              return translated
                  except Exception:
                      pass
                  return ""
              chunks = [text] if len(text) <= 450 else []
              if not chunks:
                  sentences = re.split(r'(?<=[.!?])\\s+', text)
                  current = ""
                  for s in sentences:
                      if len(current) + len(s) + 1 > 450:
                          if current: chunks.append(current)
                          current = s
                      else:
                          current = (current + " " + s).strip() if current else s
                  if current: chunks.append(current)
              joined = " ".join(r for r in [_translate_one(c) for c in chunks] if r).strip()
              if joined: return joined
              try:
                  res = generate_text(f"Translate to {target_lang}. Only output translation:\\n\\n{text}", max_tokens=500)
                  if res: return res.strip()
              except Exception:
                  pass
              return ""
          """)

