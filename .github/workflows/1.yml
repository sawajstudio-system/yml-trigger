              # render_3/ass_builder.py
              write_py(f"{base}/render_3/ass_builder.py", f"""
              import os, re
              DOT_PALETTE = ["&H003898FF&", "&H00FFCC44&", "&H0018B8FF&", "&H0078FF88&", "&H00FF78E8&"]
              WORD_PALETTE = ["&H00FFCC44&", "&H0088FF99&", "&H0022E8FF&", "&H00FF78E8&", "&H0055AAFF&", "&H00FFFF66&"]

              def _fmt_ts(sec):
                  sec = max(0.0, float(sec))
                  h, m, s = int(sec // 3600), int((sec % 3600) // 60), int(sec % 60)
                  cs = min(99, int(round((sec - int(sec)) * 100)))
                  return f"{{h}}:{{m:02d}}:{{s:02d}}.{{cs:02d}}"

              def _split_words(text):
                  words = [w.strip() for w in str(text or "").split() if w.strip()]
                  chunks, i, n = [], 0, len(words)
                  while i < n:
                      rem = n - i
                      step = rem if rem <= 3 else (2 if rem == 4 else 3)
                      chunks.append(" ".join(words[i:i + step]))
                      i += step
                  return chunks

              def _colorize(chunk_text, step_idx, lang_offset=0):
                  words = [w for w in str(chunk_text or "").split() if w]
                  return " ".join(f"{{{{\\1c{{WORD_PALETTE[(step_idx * 2 + lang_offset + idx) % len(WORD_PALETTE)]}}}}}}{{w}}" for idx, w in enumerate(words))

              def create_main_subtitles(hadith, hindi_text, duration, output_path="temp/main_subtitles.ass"):
                  h_dict = hadith if isinstance(hadith, dict) else {{}}
                  ara_parts = _split_words(re.sub(r'[\\"\\n\\r]', " ", str(h_dict.get("arabic", ""))).strip())
                  hin_parts = _split_words(re.sub(r'[\\"\\n\\r]', " ", str(hindi_text or "")).strip())
                  eng_parts = _split_words(re.sub(r'[\\"\\n\\r]', " ", str(h_dict.get("english", ""))).strip())
                  steps = max(len(ara_parts), len(hin_parts), len(eng_parts), 1)

                  header = [
                      "[Script Info]",
                      "ScriptType: v4.00+",
                      "PlayResX: {cfg['width']}",
                      "PlayResY: {cfg['height']}",
                      "WrapStyle: 2",
                      "",
                      "[V4+ Styles]",
                      "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
                      "Style: DotAra,Arial,56,&H00FFFFFF&,&H000000FF&,&H00000000&,&H88000000,-1,0,0,0,100,100,0,0,1,3,2,5,60,60,0,1",
                      "Style: AraText,Amiri,{cfg['font_ara']},&H00FFFFFF&,&H000000FF&,&H00000000&,&H88000000,-1,0,0,0,100,100,0,0,1,3,2,5,120,60,0,1",
                      "Style: DotHin,Arial,56,&H00FFFFFF&,&H000000FF&,&H00000000&,&H88000000,-1,0,0,0,100,100,0,0,1,3,2,5,60,60,0,1",
                      "Style: HinText,Yatra One,{cfg['font_hin']},&H00FFFFFF&,&H000000FF&,&H00000000&,&H88000000,-1,0,0,0,100,100,0,0,1,3,2,5,120,60,0,1",
                      "Style: DotEng,Arial,56,&H00FFFFFF&,&H000000FF&,&H00000000&,&H88000000,-1,0,0,0,100,100,0,0,1,3,2,5,60,60,0,1",
                      "Style: EngText,Playfair Display,{cfg['font_eng']},&H00FFFFFF&,&H000000FF&,&H00000000&,&H88000000,-1,0,0,0,100,100,0,0,1,3,2,5,120,60,0,1",
                      "",
                      "[Events]",
                      "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
                  ]
                  t_start = 4.0
                  t_end = max(float(duration or 20.0) - 4.2, t_start + 3.0)
                  step_dur = (t_end - t_start) / steps
                  lines = []
                  for i in range(steps):
                      s, e = t_start + i * step_dur, t_start + (i + 1) * step_dur
                      a_val = ara_parts[i % len(ara_parts)] if ara_parts else ""
                      h_val = hin_parts[i % len(hin_parts)] if hin_parts else ""
                      e_val = eng_parts[i % len(eng_parts)] if eng_parts else ""
                      if a_val:
                          lines.append(f"Dialogue: 1,{{_fmt_ts(s)}},{{_fmt_ts(e)}},DotAra,,,0,0,,{{{{\\pos({cfg['x_dot']},{cfg['y_ara']})\\1c{{DOT_PALETTE[i % len(DOT_PALETTE)]}}\\3c&H000000&\\blur1}}}}●")
                          lines.append(f"Dialogue: 1,{{_fmt_ts(s)}},{{_fmt_ts(e)}},AraText,,,0,0,,{{{{\\pos({cfg['x_ara']},{cfg['y_ara']})\\3c&H000000&\\blur1}}}}{{_colorize(a_val, i, 0)}}")
                      if h_val:
                          lines.append(f"Dialogue: 1,{{_fmt_ts(s)}},{{_fmt_ts(e)}},DotHin,,,0,0,,{{{{\\pos({cfg['x_dot']},{cfg['y_hin']})\\1c{{DOT_PALETTE[(i+1) % len(DOT_PALETTE)]}}\\3c&H000000&\\blur1}}}}●")
                          lines.append(f"Dialogue: 1,{{_fmt_ts(s)}},{{_fmt_ts(e)}},HinText,,,0,0,,{{{{\\pos({cfg['x_hin']},{cfg['y_hin']})\\3c&H000000&\\blur1}}}}{{_colorize(h_val, i, 2)}}")
                      if e_val:
                          lines.append(f"Dialogue: 1,{{_fmt_ts(s)}},{{_fmt_ts(e)}},DotEng,,,0,0,,{{{{\\pos({cfg['x_dot']},{cfg['y_eng']})\\1c{{DOT_PALETTE[(i+2) % len(DOT_PALETTE)]}}\\3c&H000000&\\blur1}}}}●")
                          lines.append(f"Dialogue: 1,{{_fmt_ts(s)}},{{_fmt_ts(e)}},EngText,,,0,0,,{{{{\\pos({cfg['x_eng']},{cfg['y_eng']})\\3c&H000000&\\blur1}}}}{{_colorize(e_val, i, 4)}}")
                  os.makedirs(os.path.dirname(output_path) or "temp", exist_ok=True)
                  with open(output_path, "w", encoding="utf-8") as f:
                      f.write("\\n".join(header + lines) + "\\n")
                  return output_path
              """)

              # render_3/ffmpeg_render.py
              write_py(f"{base}/render_3/ffmpeg_render.py", f"""
              import os, subprocess

              def _esc(p):
                  return p.replace("\\\\", "\\\\\\\\").replace(":", "\\\\:").replace("'", "\\\\'").replace("[", "\\\\[").replace("]", "\\\\]")

              def render_final_video(bg_video, music_path, voice_path, master_ass_path, cta_image_path, duration, output_path="temp/{cfg['output_file']}", fonts_dir=None):
                  if not bg_video or not os.path.exists(bg_video) or not voice_path or not os.path.exists(voice_path):
                      return None
                  if not fonts_dir or not os.path.exists(fonts_dir):
                      fonts_dir = os.path.join(_BOT, "display_assets_2", "fonts_4")
                  abs_fonts = os.path.abspath(fonts_dir) if os.path.exists(fonts_dir) else ""
                  os.makedirs(os.path.dirname(output_path) or "temp", exist_ok=True)

                  cmd = ["ffmpeg", "-y", "-stream_loop", "-1", "-i", bg_video, "-i", voice_path]
                  has_music = bool(music_path and os.path.exists(music_path) and os.path.getsize(music_path) > 0)
                  if has_music: cmd += ["-i", music_path]
                  has_cta = bool(cta_image_path and os.path.exists(cta_image_path))
                  if has_cta: cmd += ["-loop", "1", "-i", cta_image_path]

                  cta_idx = 3 if has_music else 2
                  v = "[0:v]scale={cfg['width']}:{cfg['height']}:force_original_aspect_ratio=increase,crop={cfg['width']}:{cfg['height']},eq=brightness=0.01:contrast=1.10:saturation=1.12[bg];"
                  ass_esc = _esc(os.path.abspath(master_ass_path))
                  if abs_fonts:
                      v += f"[bg]subtitles=filename='{{ass_esc}}':fontsdir='{{_esc(abs_fonts)}}'[v_sub];"
                  else:
                      v += f"[bg]subtitles=filename='{{ass_esc}}'[v_sub];"

                  if has_cta:
                      cta_start = max(0.0, float(duration) - 4.2)
                      v += f"[v_sub][{{cta_idx}}:v]overlay=0:0:enable='gte(t,{{cta_start:.2f}})'[v_out]"
                  else:
                      v += "[v_sub]null[v_out]"

                  a = "[2:a]volume=0.15[bgm];[bgm][1:a]sidechaincompress=threshold=0.05:ratio=8:attack=50:release=500[ducked];[1:a][ducked]amix=inputs=2:duration=first[a_out]" if has_music else "[1:a]volume=1.0[a_out]"
                  cmd += ["-filter_complex", f"{{v}}; {{a}}", "-map", "[v_out]", "-map", "[a_out]", "-c:v", "libx264", "-preset", "ultrafast", "-crf", "24", "-threads", "0", "-r", "24", "-c:a", "aac", "-b:a", "128k", "-t", f"{{float(duration):.2f}}", output_path]
                  res = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
                  return output_path if res.returncode == 0 and os.path.exists(output_path) else None
              """)

              # render_3/render_video.py
              write_py(f"{base}/render_3/render_video.py", f"""
              import os
              from duration import get_audio_duration
              from cta_maker import generate_cta_image
              from ass_builder import create_main_subtitles
              from ffmpeg_render import render_final_video

              FONTS_DIR = os.path.join(_BOT, "display_assets_2", "fonts_4")

              def build_and_render(bg_video, music_path, voice_path, hadith, hindi_text, output_path="temp/{cfg['output_file']}"):
                  os.makedirs("temp", exist_ok=True)
                  voice_dur = get_audio_duration(voice_path)
