              random.shuffle(all_queries)
              queries = all_queries[:3]
              download_tasks = [(i, q, per_clip_dur, f"temp/clip_{i}.mp4") for i, q in enumerate(queries)]
              with ThreadPoolExecutor(max_workers=3) as executor:
                  results = list(executor.map(download_and_normalize, download_tasks))
              valid_clips, video_apis_used = [], set()
              with open(concat_list, "w") as f:
                  for i, (res, api) in enumerate(results):
                      if res:
                          valid_clips.append(f"temp/clip_{i}.mp4")
                          video_apis_used.add(api)
                          f.write(f"file '{os.path.abspath(f'temp/clip_{i}.mp4')}'\\n")
              video_api_str = ", ".join(video_apis_used) if video_apis_used else "None"
              if valid_clips:
                  try:
                      res_cp = subprocess.run(
                          f'ffmpeg -y -f concat -safe 0 -i "{concat_list}" -c copy "{final_bg_video}"',
                          shell=True, capture_output=True, timeout=90,
                      )
                      if res_cp.returncode != 0 or not os.path.exists(final_bg_video) or os.path.getsize(final_bg_video) < 10000:
                          subprocess.run(
                              f'ffmpeg -y -f concat -safe 0 -i "{concat_list}" -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p "{final_bg_video}"',
                              shell=True, capture_output=True, timeout=180,
                          )
                  except Exception:
                      pass
              if not os.path.exists(final_bg_video) or os.path.getsize(final_bg_video) < 10000:
                  if valid_clips:
                      final_bg_video = valid_clips[0]
                  else:
                      return send_telegram("❌ सभी बैकग्राउंड वीडियो फेल!")
              send_telegram(f"5.5 🎨 VIP Intro & Outro (Style #{style_idx + 1})...")
              intro_v, outro_v = "temp/pro_intro.mp4", "temp/pro_outro.mp4"
              has_intro = generate_video_code(intro_v, 4.0, True, hadith_info=hadith, style_idx=style_idx)
              has_outro = generate_video_code(outro_v, 4.0, False, hadith_info=hadith, style_idx=style_idx)
              if has_intro or has_outro:
                  io_concat = "temp/io_concat.txt"
                  with open(io_concat, "w") as f:
                      if has_intro:
                          f.write(f"file '{os.path.abspath(intro_v)}'\\n")
                      f.write(f"file '{os.path.abspath(final_bg_video)}'\\n")
                      if has_outro:
                          f.write(f"file '{os.path.abspath(outro_v)}'\\n")
                  merged = "temp/bg_merged.mp4"
                  try:
                      res_io = subprocess.run(
                          f'ffmpeg -y -f concat -safe 0 -i "{io_concat}" -c copy "{merged}"',
                          shell=True, capture_output=True,
                      )
                      if res_io.returncode != 0 or not os.path.exists(merged) or os.path.getsize(merged) < 10000:
                          subprocess.run(
                              f'ffmpeg -y -f concat -safe 0 -i "{io_concat}" -c:v libx264 -preset ultrafast -crf 25 -pix_fmt yuv420p "{merged}"',
                              shell=True, capture_output=True, timeout=180,
                          )
                      if os.path.exists(merged) and os.path.getsize(merged) > 10000:
                          final_bg_video = merged
                  except Exception:
                      pass
              send_telegram("6. 🎵 Music...")
              music_path = "temp/music.mp3"
              if freesound_music(query="soft ambient", duration=60, output_path=music_path):
                  music_used = "Freesound"
              elif pixabay_music(duration=60, output_path=music_path):
                  music_used = "Pixabay"
              else:
                  music_used, music_path = "None", ""
              send_telegram("7. 🎬 Final Render...")
              final_video_path = "temp/Final_Story.mp4"
              try:
                  buf = io.StringIO()
                  with contextlib.redirect_stdout(buf):
                      render_success = build_and_render_story(
                          bg_video=final_bg_video,
                          music_path=music_path,
                          voice_path=voice_path,
                          hadith=hadith,
                          hindi_text=hindi_text,
                          intro_text=intro_text,
                          outro_text=outro_text,
                          cta_text=cta_text,
                          output_path=final_video_path,
                      )
                  if "❌ === FFMPEG ERROR START ===" in buf.getvalue():
                      return send_telegram("❌ FFmpeg Error.")
              except Exception as e:
                  return send_telegram(f"❌ Python Error: {e}")
              if not render_success or not os.path.exists(final_video_path):
                  return send_telegram("❌ Video Rendering Failed.")
              send_telegram("8. ☁️ Upload to Drive...")
              drive_link = upload_to_drive(final_video_path)
              report = (
                  f"🎉 <b>Video Ready!</b>\\n"
                  f"📜 <b>Book:</b> {book_hi} ({author_hi})\\n"
                  f"🔢 <b>Hadith #:</b> {hadith_num}\\n"
                  f"🎨 <b>VIP Style:</b> #{style_idx + 1}\\n"
                  f"🎙️ <b>Voice:</b> {voice_used} (Slowed + Book Intro)\\n"
                  f"🎥 <b>Video:</b> {video_api_str}\\n"
                  f"🎵 <b>Music:</b> {music_used}\\n"
              )
              if drive_link:
                  report += f"\\n📥 <a href='{drive_link}'>Click here</a>"
              send_telegram(report)
              try:
                  shutil.rmtree("temp", ignore_errors=True)
              except Exception:
                  pass

          if __name__ == "__main__":
              try:
                  run_pipeline()
              except Exception:
                  tb = traceback.format_exc()
                  send_telegram(f"💥 <b>Crash!</b>\\n<pre>{tb[-1500:]}</pre>")
          """)

          print("✅ Migration script completed.")
          EOF

      - name: 3. 📤 Commit & Push Changes to Development
        shell: bash
        run: |
          set -e
          git config user.name "SAWAJ STUDIO Bot"
          git config user.email "bot@sawajstudio.local"
          git remote set-url origin "https://x-access-token:${TOKEN_GITHUB}@github.com/${{ github.repository_owner }}/Development.git"
          git add -A
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit."
          else
            git commit -m "Refactor repo into indexed bot/ structure"
            git push origin HEAD
            echo "✅ Pushed new bot/ structure to Development."
          fi
