          write_py("bot/video_generator_3/story_3/render_3/ass_builder.py", """
          import os, re
          from palette import get_color_tag

          DOT_PALETTE = [
              "&H003898FF&", "&H00FFCC44&", "&H0018B8FF&", "&H0078FF88&", "&H00FF78E8&",
          ]
          WORD_PALETTE = [
              "&H00FFCC44&", "&H0088FF99&", "&H0022E8FF&", "&H00FF78E8&", "&H0055AAFF&", "&H00FFFF66&",
          ]

          def _fmt_ts(sec):
              sec = max(0.0, float(sec))
              h = int(sec // 3600)
              m = int((sec % 3600) // 60)
              s = int(sec % 60)
              cs = min(99, int(round((sec - int(sec)) * 100)))
              return f"{h}:{m:02d}:{s:02d}.{cs:02d}"

          def _split_2_to_3_words(text):
              words = [w.strip() for w in str(text or "").split() if w.strip()]
              if not words:
                  return []
              chunks, i, n = [], 0, len(words)
              while i < n:
                  rem = n - i
                  step = rem if rem <= 3 else (2 if rem == 4 else 3)
                  chunks.append(" ".join(words[i:i + step]))
                  i += step
              return chunks

          def _colorize_words(chunk_text, step_idx, lang_offset=0):
              words = [w for w in str(chunk_text or "").split() if w]
              if not words:
                  return ""
              parts = []
              for w_idx, word in enumerate(words):
                  col = WORD_PALETTE[(step_idx * 2 + lang_offset + w_idx) % len(WORD_PALETTE)] or get_color_tag(w_idx)
                  parts.append(f"{{\\1c{col}}}{word}")
              return " ".join(parts)

          def create_main_subtitles(hadith, hindi_text, duration, output_path="temp/main_subtitles.ass"):
              hadith_dict = hadith if isinstance(hadith, dict) else {}
              ara_src = re.sub(r'[\\"\\n\\r]', " ", str(hadith_dict.get("arabic", ""))).strip()
              hin_src = re.sub(r'[\\"\\n\\r]', " ", str(hindi_text or "")).strip()
              eng_src = re.sub(r'[\\"\\n\\r]', " ", str(hadith_dict.get("english", ""))).strip()

              ara_parts = _split_2_to_3_words(ara_src)
              hin_parts = _split_2_to_3_words(hin_src)
              eng_parts = _split_2_to_3_words(eng_src)
              steps = max(len(ara_parts), len(hin_parts), len(eng_parts), 1)

              header = [
                  "[Script Info]",
                  "ScriptType: v4.00+",
                  "PlayResX: 1080",
                  "PlayResY: 1920",
                  "WrapStyle: 2",
                  "",
                  "[V4+ Styles]",
                  "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
                  "Style: DotAra,Arial,62,&H00FFFFFF&,&H000000FF&,&H00000000&,&H88000000,-1,0,0,0,100,100,0,0,1,3,2,5,60,60,0,1",
                  "Style: AraText,Amiri,66,&H00FFFFFF&,&H000000FF&,&H00000000&,&H88000000,-1,0,0,0,100,100,0,0,1,3,2,5,120,60,0,1",
                  "Style: DotHin,Arial,62,&H00FFFFFF&,&H000000FF&,&H00000000&,&H88000000,-1,0,0,0,100,100,0,0,1,3,2,5,60,60,0,1",
                  "Style: HinText,Yatra One,58,&H00FFFFFF&,&H000000FF&,&H00000000&,&H88000000,-1,0,0,0,100,100,0,0,1,3,2,5,120,60,0,1",
                  "Style: DotEng,Arial,62,&H00FFFFFF&,&H000000FF&,&H00000000&,&H88000000,-1,0,0,0,100,100,0,0,1,3,2,5,60,60,0,1",
                  "Style: EngText,Playfair Display,54,&H00FFFFFF&,&H000000FF&,&H00000000&,&H88000000,-1,0,0,0,100,100,0,0,1,3,2,5,120,60,0,1",
                  "",
                  "[Events]",
                  "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text",
              ]

              t_start = 4.0
              t_end = max(float(duration or 20.0) - 4.2, t_start + 3.0)
              step_dur = (t_end - t_start) / steps

              lines = []
              for i in range(steps):
                  s = t_start + i * step_dur
                  e = s + step_dur
                  a_val = ara_parts[i % len(ara_parts)] if ara_parts else ""
                  h_val = hin_parts[i % len(hin_parts)] if hin_parts else ""
                  e_val = eng_parts[i % len(eng_parts)] if eng_parts else ""

                  dot_a = DOT_PALETTE[i % len(DOT_PALETTE)]
                  dot_h = DOT_PALETTE[(i + 1) % len(DOT_PALETTE)]
                  dot_e = DOT_PALETTE[(i + 2) % len(DOT_PALETTE)]

                  if a_val:
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},DotAra,,,0,0,,{{\\pos(105,830)\\1c{dot_a}\\3c&H000000&\\blur1}}●")
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},AraText,,,0,0,,{{\\pos(390,830)\\3c&H000000&\\blur1}}{_colorize_words(a_val, i, 0)}")
                  if h_val:
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},DotHin,,,0,0,,{{\\pos(105,1030)\\1c{dot_h}\\3c&H000000&\\blur1}}●")
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},HinText,,,0,0,,{{\\pos(430,1030)\\3c&H000000&\\blur1}}{_colorize_words(h_val, i, 2)}")
                  if e_val:
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},DotEng,,,0,0,,{{\\pos(105,1230)\\1c{dot_e}\\3c&H000000&\\blur1}}●")
                      lines.append(f"Dialogue: 1,{_fmt_ts(s)},{_fmt_ts(e)},EngText,,,0,0,,{{\\pos(460,1230)\\3c&H000000&\\blur1}}{_colorize_words(e_val, i, 4)}")

              out_dir = os.path.dirname(output_path) or "temp"
              os.makedirs(out_dir, exist_ok=True)
              with open(output_path, "w", encoding="utf-8") as f:
                  f.write("\\n".join(header + lines) + "\\n")
              return output_path

          def create_intro_subtitle(intro_text, duration=3.5, output_path="temp/intro_sub.ass"):
              return None

          def create_outro_subtitle(outro_text, total_duration, outro_duration=3.5, output_path="temp/outro_sub.ass"):
              return None
          """)

          write_py("bot/video_generator_3/story_3/render_3/ffmpeg_render.py", """
          import os, subprocess, sys

          def _esc_ffmpeg_path(p):
              return (
                  p.replace("\\\\", "\\\\\\\\")
                  .replace(":", "\\\\:")
                  .replace("'", "\\\\'")
                  .replace("[", "\\\\[")
                  .replace("]", "\\\\]")
              )

          def render_final_video(
              bg_video,
              music_path,
              voice_path,
              master_ass_path,
              cta_image_path,
              duration,
              output_path="temp/Final_Story.mp4",
              fonts_dir=None,
              logo_path=None,
          ):
              sys.stdout.flush()
              if not bg_video or not os.path.exists(bg_video) or not voice_path or not os.path.exists(voice_path):
                  print("❌ [ffmpeg_render] Missing bg_video or voice_path.")
                  return None
              if not master_ass_path or not os.path.exists(master_ass_path):
                  print("❌ [ffmpeg_render] Missing master_ass_path.")
                  return None

              if fonts_dir is None or not os.path.exists(fonts_dir):
                  fonts_dir = os.path.join(_BOT, "assets_2", "fonts_4")
              abs_fonts = os.path.abspath(fonts_dir) if fonts_dir and os.path.exists(fonts_dir) else ""

              out_dir = os.path.dirname(output_path) or "temp"
              os.makedirs(out_dir, exist_ok=True)

              cmd = ["ffmpeg", "-y", "-stream_loop", "-1", "-i", bg_video, "-i", voice_path]
              has_music = bool(music_path and os.path.exists(music_path) and os.path.getsize(music_path) > 0)
              if has_music:
                  cmd += ["-i", music_path]

              has_cta = bool(cta_image_path and os.path.exists(cta_image_path))
              if has_cta:
                  cmd += ["-loop", "1", "-i", cta_image_path]

              cta_idx = 3 if has_music else 2
              v = "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,eq=brightness=0.01:contrast=1.10:saturation=1.12[bg];"

              abs_ass_esc = _esc_ffmpeg_path(os.path.abspath(master_ass_path))
              abs_fonts_esc = _esc_ffmpeg_path(abs_fonts) if abs_fonts else ""

              if abs_fonts_esc:
                  v += f"[bg]subtitles=filename='{abs_ass_esc}':fontsdir='{abs_fonts_esc}'[v_sub];"
              else:
                  v += f"[bg]subtitles=filename='{abs_ass_esc}'[v_sub];"

              if has_cta:
                  cta_start = max(0.0, float(duration) - 4.2)
                  v += f"[v_sub][{cta_idx}:v]overlay=0:0:enable='gte(t,{cta_start:.2f})'[v_out]"
              else:
                  v += "[v_sub]null[v_out]"

              if has_music:
                  a = (
                      "[2:a]volume=0.15[bgm];"
                      "[bgm][1:a]sidechaincompress=threshold=0.05:ratio=8:attack=50:release=500[ducked];"
                      "[1:a][ducked]amix=inputs=2:duration=first[a_out]"
                  )
              else:
                  a = "[1:a]volume=1.0[a_out]"

              cmd += [
                  "-filter_complex", f"{v}; {a}",
                  "-map", "[v_out]", "-map", "[a_out]",
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "24", "-threads", "0", "-r", "24",
                  "-c:a", "aac", "-b:a", "128k",
                  "-t", f"{float(duration):.2f}",
                  output_path,
              ]
              try:
                  res = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
                  if res.returncode != 0:
                      print("❌ === FFMPEG ERROR START ===")
                      print(res.stderr[-2000:])
                      print("❌ === FFMPEG ERROR END ===")
                      return None
                  return output_path
              except Exception as exc:
                  print(f"❌ [ffmpeg_render] Exception: {exc}")
                  return None
          """)

