name: 🚀 Build Full SAWAJ STUDIO (Long + Short + Story)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_all_pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/Development"
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. 🏗️ Build Full bot/ Structure with Long, Short & Story Code
        shell: bash
        run: |
          set -e
          python3 - <<'EOF'
          import os
          import shutil
          import json

          root = os.getcwd()

          # 1. Clean legacy & previous structures
          for d in [
              "Assets_Config", "Sources", "Story",
              "generator_1", "long_generator_2", "short_generator_3", "story_generator_4",
              "video_generator_3", "upload_4", "gdrive_upload_4", "bot", "temp"
          ]:
              p = os.path.join(root, d)
              if os.path.exists(p):
                  shutil.rmtree(p)

          # 2. Create exact SAWAJ STUDIO bot/ directory tree
          dirs = [
              # provider_1
              "bot/provider_1/clients_1",
              "bot/provider_1/tts_2",
              "bot/provider_1/engines_3",
              "bot/provider_1/hadith_4",
              "bot/provider_1/quran_5",
              "bot/provider_1/calendar_6",
              "bot/provider_1/filters_7",
              "bot/provider_1/glossaries_8",
              "bot/provider_1/templates_9",
              "bot/provider_1/thumbnails_10",
              "bot/provider_1/config_11",
              "bot/provider_1/fallback_12",
              # display_assets_2
              "bot/display_assets_2/backgrounds_1",
              "bot/display_assets_2/clips_2",
              "bot/display_assets_2/overlays_3",
              "bot/display_assets_2/fonts_4",
              "bot/display_assets_2/logos_5",
              "bot/display_assets_2/sound_effects_6",
              "bot/display_assets_2/temp_7",
              "bot/display_assets_2/intro_8",
              "bot/display_assets_2/outro_9",
              "bot/display_assets_2/cta_10",
              "bot/display_assets_2/music_11",
              "bot/display_assets_2/voice_12",
              "bot/display_assets_2/stickers_13",
              # video_generator_3
              "bot/video_generator_3/long_1/trigger_1",
              "bot/video_generator_3/long_1/script_2",
              "bot/video_generator_3/long_1/render_3",
              "bot/video_generator_3/long_1/outputs_4",
              "bot/video_generator_3/long_1/uploader_5",
              "bot/video_generator_3/short_2/trigger_1",
              "bot/video_generator_3/short_2/script_2",
              "bot/video_generator_3/short_2/render_3",
              "bot/video_generator_3/short_2/outputs_4",
              "bot/video_generator_3/short_2/uploader_5",
              "bot/video_generator_3/story_3/trigger_1",
              "bot/video_generator_3/story_3/script_2",
              "bot/video_generator_3/story_3/render_3",
              "bot/video_generator_3/story_3/outputs_4",
              "bot/video_generator_3/story_3/uploader_5",
              # upload_4
              "bot/upload_4/gdrive_1/long_video_upload_1",
              "bot/upload_4/gdrive_1/short_video_upload_2",
              "bot/upload_4/gdrive_1/story_video_upload_3",
          ]
          for d in dirs:
              os.makedirs(os.path.join(root, d), exist_ok=True)

          for keep_dir in [
              "bot/display_assets_2/temp_7",
              "bot/video_generator_3/long_1/outputs_4",
              "bot/video_generator_3/short_2/outputs_4",
              "bot/video_generator_3/story_3/outputs_4",
          ]:
              with open(os.path.join(root, keep_dir, ".gitkeep"), "w", encoding="utf-8") as f:
                  f.write("")

          BOOTSTRAP = '''# --- AUTO PATH BOOTSTRAP ---
          import os as _os, sys as _sys
          _HERE = _os.path.dirname(_os.path.abspath(__file__))
          _BOT = _HERE
          for _ in range(6):
              if _os.path.basename(_BOT) == "bot" and _os.path.isdir(_os.path.join(_BOT, "provider_1")):
                  break
              if _os.path.isdir(_os.path.join(_BOT, "bot", "provider_1")):
                  _BOT = _os.path.join(_BOT, "bot")
                  break
              _BOT = _os.path.dirname(_BOT)
          _PATHS = [
              _BOT,
              _os.path.join(_BOT, "provider_1", "clients_1"),
              _os.path.join(_BOT, "provider_1", "tts_2"),
              _os.path.join(_BOT, "provider_1", "engines_3"),
              _os.path.join(_BOT, "provider_1", "hadith_4"),
              _os.path.join(_BOT, "provider_1", "quran_5"),
              _os.path.join(_BOT, "provider_1", "calendar_6"),
              _os.path.join(_BOT, "provider_1", "filters_7"),
              _os.path.join(_BOT, "provider_1", "glossaries_8"),
              _os.path.join(_BOT, "provider_1", "templates_9"),
              _os.path.join(_BOT, "provider_1", "thumbnails_10"),
              _os.path.join(_BOT, "provider_1", "config_11"),
              _os.path.join(_BOT, "provider_1", "fallback_12"),
              _os.path.join(_BOT, "display_assets_2"),
              _os.path.join(_BOT, "display_assets_2", "fonts_4"),
              _os.path.join(_BOT, "display_assets_2", "logos_5"),
              _os.path.join(_BOT, "upload_4", "gdrive_1", "long_video_upload_1"),
              _os.path.join(_BOT, "upload_4", "gdrive_1", "short_video_upload_2"),
              _os.path.join(_BOT, "upload_4", "gdrive_1", "story_video_upload_3"),
          ]
          # Add local sibling module folders (trigger_1, script_2, render_3, uploader_5)
          _PARENT = _os.path.dirname(_HERE)
          if _os.path.basename(_PARENT) in ("long_1", "short_2", "story_3"):
              for _sub in ("trigger_1", "script_2", "render_3", "outputs_4", "uploader_5"):
                  _sp = _os.path.join(_PARENT, _sub)
                  if _os.path.isdir(_sp):
                      _PATHS.append(_sp)
          for _p in reversed(_PATHS):
              if _os.path.isdir(_p) and _p not in _sys.path:
                  _sys.path.insert(0, _p)
          # --- END AUTO PATH BOOTSTRAP ---
          '''.replace("          ", "")

          def write_py(rel_path, body):
              full = os.path.join(root, rel_path)
              os.makedirs(os.path.dirname(full), exist_ok=True)
              with open(full, "w", encoding="utf-8") as f:
                  f.write(BOOTSTRAP + "\n" + body.lstrip())

          def write_txt(rel_path, content):
              full = os.path.join(root, rel_path)
              os.makedirs(os.path.dirname(full), exist_ok=True)
              with open(full, "w", encoding="utf-8") as f:
                  f.write(content.lstrip())

          write_txt(".gitignore", """
          **/__pycache__/
          *.py[cod]
          temp/
          *.tmp
          .DS_Store
          Thumbs.db
          .vscode/
          .idea/
          *.swp
          .env
          .env.local
          """)

          write_txt("bot/requirements.txt", """
          requests
          edge-tts
          google-api-python-client
          google-auth-httplib2
          google-auth-oauthlib
          Pillow
          mutagen
          numpy
          PyYAML
          """)

          # =========================================================================
          # 1. PROVIDER_1 (SHARED CLIENTS, TTS, ENGINES, HADITH, FALLBACKS, CONFIGS)
          # =========================================================================
          write_py("bot/provider_1/clients_1/gemini.py", """
          import os, requests, random
          def generate(prompt, max_tokens=500):
              api_key = os.getenv("GEMINI_API_KEY")
              if not api_key: return None
              styles = ["emotional and heart-touching", "motivational and energetic", "calm and peaceful", "storytelling and engaging", "deep and philosophical", "simple and easy to understand"]
              enhanced_prompt = f"Write the following in a {random.choice(styles)} tone. Make sure the wording is completely unique, fresh, and engaging.\\n\\n{prompt}"
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={api_key}"
              payload = {"contents": [{"parts": [{"text": enhanced_prompt}]}], "generationConfig": {"maxOutputTokens": max_tokens, "temperature": 0.9, "topP": 0.95, "topK": 40}}
              try:
                  r = requests.post(url, json=payload, timeout=30)
                  if r.status_code == 200:
                      return r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
              except Exception:
                  pass
              return None
          """)

          write_py("bot/provider_1/clients_1/openrouter.py", """
          import os, requests, random
          def generate(prompt, max_tokens=500):
              api_key = os.getenv("OPENROUTER_API_KEY")
              if not api_key: return None
              styles = ["emotional and heart-touching", "motivational and energetic", "calm and peaceful", "storytelling and engaging", "deep and philosophical"]
              enhanced_prompt = f"Write in a {random.choice(styles)} tone. Make it unique.\\n\\n{prompt}"
              url = "https://openrouter.ai/api/v1/chat/completions"
              headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json", "HTTP-Referer": "https://github.com/sawajstudio-system", "X-Title": "Sawaj Studio"}
              payload = {"model": "openai/gpt-4o-mini", "messages": [{"role": "user", "content": enhanced_prompt}], "max_tokens": max_tokens, "temperature": 0.9}
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=30)
                  if r.status_code == 200:
                      return r.json()["choices"][0]["message"]["content"].strip()
              except Exception:
                  pass
              return None
          """)

          write_py("bot/provider_1/clients_1/groq.py", """
          import os, requests, random
          def generate(prompt, max_tokens=500):
              api_key = os.getenv("GROQ_API_KEY")
              if not api_key: return None
              styles = ["emotional and heart-touching", "motivational and energetic", "calm and peaceful", "storytelling and engaging", "deep and philosophical"]
              enhanced_prompt = f"Write in a {random.choice(styles)} tone. Make it unique.\\n\\n{prompt}"
              url = "https://api.groq.com/openai/v1/chat/completions"
              headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}
              payload = {"model": "llama-3.3-70b-versatile", "messages": [{"role": "user", "content": enhanced_prompt}], "max_tokens": max_tokens, "temperature": 0.9}
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=30)
                  if r.status_code == 200:
                      return r.json()["choices"][0]["message"]["content"].strip()
              except Exception:
                  pass
              return None
          """)

          write_py("bot/provider_1/clients_1/cohere.py", """
          import os, requests, random
          def generate(prompt, max_tokens=500):
              api_key = os.getenv("COHERE_API_KEY")
              if not api_key: return None
              styles = ["emotional and heart-touching", "motivational and energetic", "calm and peaceful", "storytelling and engaging", "deep and philosophical"]
              enhanced_prompt = f"Write in a {random.choice(styles)} tone. Make it unique.\\n\\n{prompt}"
              url = "https://api.cohere.com/v2/chat"
              headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}
              payload = {"model": "command-r-plus", "messages": [{"role": "user", "content": enhanced_prompt}], "max_tokens": max_tokens, "temperature": 0.9}
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=30)
                  if r.status_code == 200:
                      return r.json()["message"]["content"][0]["text"].strip()
              except Exception:
                  pass
              return None
          """)

          write_py("bot/provider_1/clients_1/nvidia.py", """
          import os, requests, random
          def generate(prompt, max_tokens=500):
              api_key = os.getenv("NVIDIA_API_KEY")
              if not api_key: return None
              styles = ["emotional and heart-touching", "motivational and energetic", "calm and peaceful", "storytelling and engaging", "deep and philosophical"]
              enhanced_prompt = f"Write in a {random.choice(styles)} tone. Make it unique.\\n\\n{prompt}"
              url = "https://integrate.api.nvidia.com/v1/chat/completions"
              headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}
              payload = {"model": "nvidia/llama-3.1-nemotron-70b-instruct", "messages": [{"role": "user", "content": enhanced_prompt}], "max_tokens": max_tokens, "temperature": 0.9, "top_p": 1.0}
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=30)
                  if r.status_code == 200:
                      msg_obj = r.json()["choices"][0]["message"]
                      return (msg_obj.get("content") or msg_obj.get("reasoning_content") or "").strip()
              except Exception:
                  pass
              return None
          """)

          write_py("bot/provider_1/clients_1/cloudflare.py", """
          import os, requests, random
          def generate(prompt, max_tokens=500):
              account_id = os.getenv("CLOUDFLARE_ACCOUNT_ID")
              api_token = os.getenv("CLOUDFLARE_API_TOKEN")
              if not account_id or not api_token: return None
              styles = ["emotional and heart-touching", "motivational and energetic", "calm and peaceful", "storytelling and engaging", "deep and philosophical"]
              enhanced_prompt = f"Write in a {random.choice(styles)} tone. Make it unique.\\n\\n{prompt}"
              model = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
              url = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/run/{model}"
              headers = {"Authorization": f"Bearer {api_token}", "Content-Type": "application/json"}
              payload = {"messages": [{"role": "system", "content": "You are a helpful assistant."}, {"role": "user", "content": enhanced_prompt}], "max_tokens": max_tokens, "temperature": 0.9}
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=30)
                  if r.status_code == 200 and r.json().get("success"):
                      return r.json().get("result", {}).get("response", "").strip()
              except Exception:
                  pass
              return None
          """)

          write_py("bot/provider_1/clients_1/anges.py", """
          import os, requests, random
          def generate(prompt, max_tokens=500):
              api_key = os.getenv("ANGES_API_KEY")
              if not api_key: return None
              styles = ["emotional and heart-touching", "motivational and energetic", "calm and peaceful", "storytelling and engaging", "deep and philosophical"]
              enhanced_prompt = f"Write in a {random.choice(styles)} tone. Make it unique.\\n\\n{prompt}"
              url = "https://apihub.agnes-ai.com/v1/chat/completions"
              headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}
              payload = {"model": "agnes-2.5-flash", "messages": [{"role": "user", "content": enhanced_prompt}], "max_tokens": max_tokens, "temperature": 0.9}
              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=30)
                  if r.status_code == 200:
                      return r.json()["choices"][0]["message"]["content"].strip()
              except Exception:
                  pass
              return None
          """)

          write_py("bot/provider_1/tts_2/elevenlabs.py", """
          import os, requests
          API_KEY_ENV = "ELEVENLABS_API_KEY"
          VOICE_ID = "pNInz6obpgDQGcFmaJgB"
          API_URL = f"https://api.elevenlabs.io/v1/text-to-speech/{VOICE_ID}"
          def generate(text, output_path="temp/voice.mp3"):
              api_key = os.getenv(API_KEY_ENV)
              if not api_key: return None
              headers = {"Accept": "audio/mpeg", "Content-Type": "application/json", "xi-api-key": api_key}
              payload = {"text": text, "model_id": "eleven_multilingual_v2", "voice_settings": {"stability": 0.50, "similarity_boost": 0.85, "style": 0.35, "use_speaker_boost": True, "speed": 0.85}}
              try:
                  r = requests.post(API_URL, json=payload, headers=headers, timeout=60)
                  if r.status_code == 200 and len(r.content) > 1000:
                      os.makedirs(os.path.dirname(output_path) or "temp", exist_ok=True)
                      with open(output_path, "wb") as f:
                          f.write(r.content)
                      return output_path
              except Exception:
                  pass
              return None
          """)

          write_py("bot/provider_1/tts_2/edge_tts.py", """
          import os, requests
          def _chunk_by_words(text, max_chars=150):
              words = text.split()
              chunks, current = [], ""
              for w in words:
                  if len(current) + len(w) + 1 > max_chars:
                      if current: chunks.append(current)
                      current = w
                  else:
                      current = (current + " " + w).strip() if current else w
              if current: chunks.append(current)
              return chunks if chunks else [text]
          def generate(text, output_path="temp/voice_edge.mp3"):
              try:
                  os.makedirs(os.path.dirname(output_path) or "temp", exist_ok=True)
                  chunks = _chunk_by_words(text, max_chars=150)
                  audio_data = b""
                  headers = {"User-Agent": "Mozilla/5.0"}
                  for chunk in chunks:
                      params = {"ie": "UTF-8", "q": chunk, "tl": "hi", "client": "tw-ob"}
                      r = requests.get("https://translate.google.com/translate_tts", params=params, headers=headers, timeout=15)
                      if r.status_code == 200: audio_data += r.content
                  if len(audio_data) > 1000:
                      with open(output_path, "wb") as f: f.write(audio_data)
                      return output_path
              except Exception:
                  pass
              return None
          """)

          # Video fetchers support orientation ("portrait" or "landscape") & resolution ("1080x1920" or "1920x1080")
          write_py("bot/provider_1/engines_3/pexels_video.py", """
          import os, requests
          def fetch(query="islamic mosque night", duration=60, output_path="temp/bg_video.mp4", orientation="portrait"):
              api_key = os.getenv("PEXELS_API_KEY")
              if not api_key: return None
              headers = {"Authorization": api_key}
              url = f"https://api.pexels.com/videos/search?query={query}&orientation={orientation}&per_page=5"
              try:
                  r = requests.get(url, headers=headers, timeout=15)
                  if r.status_code == 200:
                      videos = r.json().get("videos", [])
                      if videos:
                          video_files = videos[0].get("video_files", [])
                          if not video_files: return None
                          best_file = video_files[0]
                          target_min, target_max = (1280, 1920) if orientation == "landscape" else (720, 1080)
                          for vf in video_files:
                              if target_min <= vf.get("width", 0) <= target_max:
                                  best_file = vf
                                  break
                          vid_data = requests.get(best_file["link"], timeout=30).content
                          os.makedirs(os.path.dirname(output_path) or "temp", exist_ok=True)
                          with open(output_path, "wb") as f: f.write(vid_data)
                          return output_path
              except Exception:
                  pass
              return None
          """)

          write_py("bot/provider_1/engines_3/pixabay_video.py", """
          import os, requests
          def fetch(query="islamic mosque night", duration=60, output_path="temp/bg_video.mp4", orientation="portrait"):
              api_key = os.getenv("PIXABAY_API_KEY")
              if not api_key: return None
              pix_orient = "horizontal" if orientation == "landscape" else "vertical"
              url = f"https://pixabay.com/api/videos/?key={api_key}&q={query}&orientation={pix_orient}&per_page=5"
              try:
                  r = requests.get(url, timeout=15)
                  if r.status_code == 200:
                      hits = r.json().get("hits", [])
                      if hits:
                          video_url = hits[0].get("videos", {}).get("large", {}).get("url")
                          if video_url:
                              vid_data = requests.get(video_url, timeout=30).content
                              os.makedirs(os.path.dirname(output_path) or "temp", exist_ok=True)
                              with open(output_path, "wb") as f: f.write(vid_data)
                              return output_path
              except Exception:
                  pass
              return None
          """)

          write_py("bot/provider_1/engines_3/coverr.py", """
          import os, requests
          def fetch(query="nature", duration=60, output_path="temp/bg_video.mp4", orientation="portrait"):
              api_key = os.getenv("COVERR_API_KEY")
              if not api_key: return None
              url = f"https://api.coverr.co/videos?query={query}&page_size=5"
              headers = {"Authorization": f"Bearer {api_key}"}
              try:
                  r = requests.get(url, headers=headers, timeout=15)
                  if r.status_code == 200:
                      hits = r.json().get("hits", [])
                      if hits:
                          video_url = hits[0].get("urls", {}).get("mp4")
                          if video_url:
                              vid_data = requests.get(video_url, timeout=30).content
                              os.makedirs(os.path.dirname(output_path) or "temp", exist_ok=True)
                              with open(output_path, "wb") as f: f.write(vid_data)
                              return output_path
              except Exception:
                  pass
              return None
          """)

          write_py("bot/provider_1/engines_3/gradient.py", """
          import os, subprocess, random
          def fetch(duration=60, output_path="temp/bg_video.mp4", resolution="1080x1920"):
              os.makedirs(os.path.dirname(output_path) or "temp", exist_ok=True)
              c0 = f"{random.randint(10,40):02x}{random.randint(10,40):02x}{random.randint(30,60):02x}"
              c1 = f"{random.randint(10,40):02x}{random.randint(10,40):02x}{random.randint(30,60):02x}"
              try:
                  cmd = f'ffmpeg -y -f lavfi -i "gradients=s={resolution}:c0=0x{c0}:c1=0x{c1}:speed=0.005" -t {duration:.2f} -c:v libx264 -preset veryfast -crf 20 {output_path}'
                  subprocess.run(cmd, shell=True, check=True, capture_output=True)
                  return output_path
              except Exception:
                  return None
          """)

          write_py("bot/provider_1/engines_3/freesound.py", """
          import os, subprocess, requests
          def fetch(query="soft ambient meditation islamic peaceful", duration=60, output_path="temp/music.mp3"):
              api_key = os.getenv("FREESOUND_API_KEY")
              if not api_key: return _generate_fallback(duration, output_path)
              url = "https://freesound.org/apiv2/search/text/"
              params = {"query": query, "token": api_key, "fields": "id,name,previews", "filter": f"duration:[10 TO {max(30, int(duration))}]", "page_size": 10}
              try:
                  r = requests.get(url, params=params, timeout=15)
                  if r.status_code == 200:
                      results = r.json().get("results", [])
                      if results:
                          previews = results[0].get("previews", {})
                          audio_url = previews.get("preview-hq-mp3") or previews.get("preview-lq-mp3")
                          if audio_url:
                              audio_data = requests.get(audio_url, timeout=30).content
                              os.makedirs(os.path.dirname(output_path) or "temp", exist_ok=True)
                              raw_music = f"{output_path}.raw.mp3"
                              with open(raw_music, "wb") as f: f.write(audio_data)
                              fade_out_start = max(duration - 3.0, 1.0)
                              cmd = f'ffmpeg -y -stream_loop -1 -i "{raw_music}" -af "volume=0.20,afade=t=in:st=0:d=2,afade=t=out:st={fade_out_start:.2f}:d=3" -t {duration:.2f} -c:a libmp3lame -b:a 192k "{output_path}"'
                              subprocess.run(cmd, shell=True, check=True, capture_output=True)
                              if os.path.exists(raw_music): os.remove(raw_music)
                              return output_path
              except Exception:
                  pass
              return _generate_fallback(duration, output_path)
          def _generate_fallback(duration, output_path):
