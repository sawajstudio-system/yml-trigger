          def draw_gold_text(base_img, text, font_path, font_size, y_pos, c_top=(255, 248, 190), c_mid=(218, 178, 60), c_bot=(142, 102, 12)):
              if not text:
                  return
              font = load_font(font_path, font_size)
              tmp_draw = ImageDraw.Draw(Image.new("RGBA", base_img.size, (0, 0, 0, 0)))
              bbox = tmp_draw.textbbox((0, 0), text, font=font)
              tw = max(1, bbox[2] - bbox[0])
              th = max(1, bbox[3] - bbox[1])
              x = (base_img.width - tw) // 2
              glow_layer = Image.new("RGBA", base_img.size, (0, 0, 0, 0))
              glow_draw = ImageDraw.Draw(glow_layer)
              glow_draw.text((x - bbox[0], y_pos - bbox[1]), text, font=font, fill=(255, 215, 0, 120))
              base_img.paste(glow_layer.filter(ImageFilter.GaussianBlur(radius=10)), (0, 0), glow_layer)
              arr_top = np.array(c_top, dtype=np.float32)
              arr_mid = np.array(c_mid, dtype=np.float32)
              arr_bot = np.array(c_bot, dtype=np.float32)
              gold_gradient = np.zeros((th, tw, 4), dtype=np.uint8)
              half_th = max(1, th / 2.0)
              for i in range(th):
                  if i < th // 2:
                      color = arr_top * (1 - i / half_th) + arr_mid * (i / half_th)
                  else:
                      color = arr_mid * (1 - (i - th / 2.0) / half_th) + arr_bot * ((i - th / 2.0) / half_th)
                  gold_gradient[i, :] = [int(color[0]), int(color[1]), int(color[2]), 255]
              mask = Image.new("L", (tw, th), 0)
              ImageDraw.Draw(mask).text((-bbox[0], -bbox[1]), text, font=font, fill=255)
              text_gold = Image.new("RGBA", (tw, th), (0, 0, 0, 0))
              text_gold.paste(Image.fromarray(gold_gradient, "RGBA"), (0, 0), mask)
              outline_layer = Image.new("RGBA", base_img.size, (0, 0, 0, 0))
              outline_draw = ImageDraw.Draw(outline_layer)
              for dx in [-2, -1, 0, 1, 2]:
                  for dy in [-2, -1, 0, 1, 2]:
                      if dx == 0 and dy == 0:
                          continue
                      outline_draw.text((x - bbox[0] + dx, y_pos - bbox[1] + dy), text, font=font, fill=(0, 0, 0, 235))
              base_img.paste(outline_layer, (0, 0), outline_layer)
              base_img.paste(text_gold, (x, y_pos), text_gold)

          def generate_video_code(output_path, duration, is_intro, hadith_info=None, style_idx=0):
