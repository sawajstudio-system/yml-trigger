                  if _download_and_process(url, duration, output_path):
                      return output_path
              print("[pixabay_music] 🔄 All Pixabay sources failed. Generating sine fallback...")
              return _generate_sine_fallback(duration, output_path)
          def _generate_sine_fallback(duration, output_path):
              try:
                  os.makedirs(os.path.dirname(output_path) or "temp", exist_ok=True)
                  fade_out = max(duration - 3.0, 1.0)
                  cmd = (
                      f'ffmpeg -y -f lavfi -i "sine=frequency=110:duration={duration:.2f}" -af '
                      f'"afade=t=in:st=0:d=2,afade=t=out:st={fade_out:.2f}:d=3,volume=0.12" '
