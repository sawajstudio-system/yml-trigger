          import os, random
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          def _find_font(names, size, font_dirs):
              cands = [os.path.join(d, n) for d in font_dirs for n in names] + [
                  "/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf",
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              ]
              for p in cands:
                  try: return ImageFont.truetype(p, size)
                  except Exception: continue
              return ImageFont.load_default()
          def generate_cta_image(output_path="temp/cta_image.png", width=1080, height=1920):
              img = Image.new("RGBA", (width, height), (0, 0, 0, 0))
              font_dirs = [os.path.join(_BOT, "display_assets_2", "fonts_4")]
              themes = [
                  {"card_bg": (10, 28, 22, 215), "border": (235, 195, 75, 245), "glow": (255, 215, 0, 120), "header": "#FFE885", "btns": ["#FFD700", "#80FFDB", "#FFF3B0", "#64DFDF"], "footer": "#F5D061"},
                  {"card_bg": (14, 18, 38, 215), "border": (120, 190, 255, 245), "glow": (90, 170, 255, 120), "header": "#D8ECFF", "btns": ["#7CC6FE", "#F4D35E", "#A8DADC", "#FFD166"], "footer": "#90E0EF"},
              ]
              theme = random.choice(themes)
              is_landscape = width > height
              font_top = _find_font(["Montserrat.ttf", "PlayfairDisplay.ttf"], 42 if is_landscape else 48, font_dirs)
              font_btn = _find_font(["Montserrat.ttf", "PlayfairDisplay.ttf"], 44 if is_landscape else 56, font_dirs)
              font_bottom = _find_font(["Lora.ttf", "Cinzel.ttf"], 38 if is_landscape else 46, font_dirs)
              if is_landscape:
                  x0, y0, x1, y1 = 560, 220, 1360, 860
              else:
                  x0, y0, x1, y1 = 150, 1130, 930, 1730
              glow_layer = Image.new("RGBA", (width, height), (0, 0, 0, 0))
              ImageDraw.Draw(glow_layer).rounded_rectangle([x0, y0, x1, y1], radius=36, outline=theme["glow"], width=10)
              img = Image.alpha_composite(img, glow_layer.filter(ImageFilter.GaussianBlur(radius=12)))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle([x0, y0, x1, y1], radius=36, fill=theme["card_bg"], outline=theme["border"], width=4)
              cx = width // 2
              draw.text((cx, y0 + 80), "Like • Share • Subscribe", font=font_top, fill=theme["header"], anchor="mm", stroke_width=2, stroke_fill=(0, 0, 0, 220))
              labels = ["LIKE", "SUBSCRIBE", "COMMENT", "SHARE"]
              for idx, label in enumerate(labels):
                  by0 = y0 + 160 + idx * 95
                  by1 = by0 + 70
                  col = theme["btns"][idx % len(theme["btns"])]
                  draw.rounded_rectangle([x0 + 100, by0, x1 - 100, by1], radius=16, fill=(12, 16, 15, 175), outline=col, width=3)
